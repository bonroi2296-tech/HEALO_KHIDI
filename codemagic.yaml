# healwith 스토어 앱 — 클라우드 맥/리눅스 빌드 (Codemagic)
#
# 이 앱은 Capacitor 라이브로드(server.url=https://healwith.co.kr)라 웹 빌드 단계가 없다.
# 빌드는 네이티브 셸만: npm 설치 → cap sync → 서명 → 스토어 업로드.
#
# ── 결제/계정 후 Codemagic UI 에서 1회 세팅하면 그대로 돌아간다 ──────────────
# iOS:
#   1. Codemagic → Teams → Integrations → App Store Connect: API 키 등록(이름 예: "healwith_asc").
#   2. Apple Developer 에서 App ID `kr.co.healwith.app` 등록 + 푸시(APNs) Capability 켜기.
#   3. Firebase 콘솔 → iOS 앱(`kr.co.healwith.app`) 추가 → GoogleService-Info.plist 다운로드
#      → ios/App/App/GoogleService-Info.plist 로 커밋(또는 Codemagic 환경변수 파일로 주입).
#      + Firebase → Cloud Messaging → APNs 인증키(.p8) 업로드.
# Android:
#   1. Codemagic → 환경변수 그룹 "google_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS(Play 서비스계정 JSON).
#   2. 키스토어: Codemagic → Code signing identities → Android keystore 업로드(reference 이름 "healwith_keystore").
#   3. Firebase 콘솔 → Android 앱(`kr.co.healwith.app`) 추가 → google-services.json 다운로드
#      → android/app/google-services.json 로 커밋.
# 공통: 서버 푸시 발송용 env(FCM_PROJECT_ID·GOOGLE_SERVICE_ACCOUNT_JSON)는 앱이 아니라 Vercel 에 설정.

workflows:
  ios-release:
    name: healwith iOS (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: healwith_asc   # ← Codemagic Integrations 에 등록한 이름
    environment:
      groups:
        - ios_signing          # CERTIFICATE_PRIVATE_KEY (애플 배포 인증서 발급용 RSA 개인키)
      vars:
        BUNDLE_ID: "kr.co.healwith.app"
      node: 22   # Capacitor CLI 8.x 는 NodeJS >=22 요구(2026-07-27 빌드 실패로 확인)
      xcode: latest
    scripts:
      - name: npm 의존성 설치
        script: npm ci
      - name: Capacitor iOS 동기화 (SPM 패키지 해결 포함)
        script: npx cap sync ios
      - name: 서명 파일 발급·적용 (없으면 새로 만든다)
        # ⚠️ 2026-07-27 첫 빌드가 여기서 죽었다: "No matching profiles found ... app_store".
        #    environment.ios_signing 블록은 «있는 프로파일을 가져오기만» 한다 → 계정에 프로파일이
        #    하나도 없는 최초 상태에서는 무조건 실패. --create 로 배포 인증서·프로파일을 만들게 바꿨다.
        # ⚠️ 2026-07-27 빌드 #3: --create 만으로는 아무것도 안 만들어진다.
        #    로그 실측 «Cannot save Signing Certificates without certificate private key» →
        #    배포 인증서를 발급하려면 CSR 서명용 RSA 개인키가 있어야 하는데 없으면 조용히 빈손으로
        #    넘어가고(프로파일 0개), 그 다음 컴파일이 «푸시 프로파일 없음»으로 죽는다(엉뚱한 데서 터짐).
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA 빌드
        # ⚠️ 이 앱은 CocoaPods 가 아니라 SPM(CapApp-SPM) 구조 → pod install/.xcworkspace 없음.
        #    xcodeproj 를 직접 빌드한다. Firebase SDK(FirebaseMessaging)는 첫 클라우드 맥 빌드에서
        #    App 타겟에 SPM 패키지로 추가해야 AppDelegate 가 컴파일된다(APP_STORE_LISTING.md 참고).
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 외부 심사 제출은 첫 빌드 수동 확인 후 켠다:
        # submit_to_app_store: false

  android-release:
    name: healwith Android (Google Play)
    instance_type: mac_mini_m2   # 무료 플랜에서 linux_x2 불가(2026-07-27 실측) — gradle 은 OS 무관이라 맥에서 빌드
    max_build_duration: 60
    environment:
      groups:
        - google_play          # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      android_signing:
        - healwith_keystore     # ← Codemagic Code signing identities 의 reference 이름
      node: 22   # Capacitor CLI 8.x 는 NodeJS >=22 요구(2026-07-27 빌드 실패로 확인)
      java: 21   # capacitor.build.gradle 이 VERSION_21 을 강제(17이면 «invalid source release: 21», 2026-07-28 실측)
    scripts:
      - name: npm 의존성 설치
        script: npm ci
      - name: Capacitor Android 동기화
        script: npx cap sync android
      - name: AAB 빌드 (서명)
        script: |
          cd android
          chmod +x ./gradlew   # 윈도우에서 커밋되면 실행비트가 없다(2026-07-27 실측 Permission denied)
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal        # internal → 검증 후 production 으로 승격
        submit_as_draft: true

  # ── 서명은 하되 Play 자동업로드는 안 하는 워크플로 (첫 출시용) ─────────────────
  #    왜: android-release 는 Play 서비스계정(GCLOUD_SERVICE_ACCOUNT_CREDENTIALS)이 있어야
  #        돌아가는데, 그 계정은 구글 클라우드에서 따로 만들어야 한다(PO 손). 그게 없어도
  #        «서명된 AAB» 자체는 지금 만들 수 있고, 그 파일을 Play 콘솔에 직접 올리면 첫 출시가 된다.
  #        서비스계정이 준비되면 android-release 로 갈아타면 그 뒤부터 완전 자동.
  android-signed:
    name: healwith Android (서명 AAB · Play 업로드 없음)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - healwith_keystore     # Codemagic → Settings → Code signing identities 의 reference 이름
      node: 22
      java: 21   # capacitor.build.gradle 이 VERSION_21 을 강제
    scripts:
      - name: npm 의존성 설치
        script: npm ci
      - name: Capacitor Android 동기화
        script: npx cap sync android
      - name: AAB 빌드 (서명)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
      - name: 도장(서명) 실제로 찍혔는지 검사
        # ⚠️ 2026-07-28: 워크플로 이름이 «서명»이어도 android/app/build.gradle 에 signingConfigs 가
        #    없으면 조용히 «서명 안 된» AAB 가 나온다. Play 에 올려봐야 거부당해서 알게 되므로
        #    (PO 손이 한 번 더 감) 빌드 단계에서 끝낸다. 서명된 AAB 는 META-INF/*.RSA 를 갖는다.
        script: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)' \
            || { echo "❌ 서명 안 된 AAB 다 — build.gradle 의 signingConfigs 확인"; exit 1; }
          echo "✅ 서명 확인됨: $AAB"
    artifacts:
      - android/app/build/outputs/**/*.aab

  # ── 서명·업로드 없이 «안드로이드가 컴파일되는가»만 확인하는 검증용 워크플로 ──────
  #    왜: 키스토어·Play 서비스계정은 PO 계정 작업이라 준비되기 전엔 android-release 를 못 돌린다.
  #        그런데 정작 «코드가 빌드되는지»는 그것들과 무관하게 지금 확인할 수 있다.
  #        (iOS 는 첫 빌드에서 서명·Node버전·SDK누락으로 4번 걸렸다 — 안드로이드는 미리 겪어둔다)
  #    나중에 PR 검증용으로도 그대로 쓸 수 있다.
  android-verify:
    name: healwith Android (빌드 검증 전용 · 서명/업로드 없음)
    instance_type: mac_mini_m2   # 무료 플랜에서 linux_x2 불가(2026-07-27 실측) — gradle 은 OS 무관이라 맥에서 빌드
    max_build_duration: 45
    environment:
      node: 22
      java: 21   # capacitor.build.gradle 이 VERSION_21 을 강제(17이면 «invalid source release: 21», 2026-07-28 실측)
    scripts:
      - name: npm 의존성 설치
        script: npm ci
      - name: Capacitor Android 동기화
        script: npx cap sync android
      - name: 디버그 AAB 빌드 (서명 불필요)
        script: |
          cd android
          chmod +x ./gradlew   # 윈도우에서 커밋되면 실행비트가 없다(2026-07-27 실측 Permission denied)
          ./gradlew bundleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.aab

  # ── 아이폰 «시뮬레이터» 화면 확인 전용 (서명 불필요 · 스토어 업로드 없음) ──────────
  #
  #  왜 만들었나 (2026-07-28):
  #    윈도우 PC 에는 아이폰 시뮬레이터가 원천적으로 없다(애플이 맥에서만 돌게 막아둠).
  #    그래서 아이폰 관련 수정 2건이 «추측으로 고치고 아무도 못 본» 상태로 남아 있었다:
  #      ① 키보드를 올렸을 때 하단 고정 바가 따라오는가 (Keyboard 블록 제거의 효과)
  #      ② 노치·다이나믹 아일랜드 밑 여백이 «두 번» 들어가지 않는가 (contentInset 되돌림)
  #    → 클라우드 맥에서 시뮬레이터를 띄우고 화면을 찍어와 눈으로 확인한다.
  #
  #  🔑 핵심: **시뮬레이터 빌드는 코드 서명이 필요 없다.** 애플 인증서·프로파일 없이 지금 돌아간다.
  #  ⚠️ 시뮬레이터로는 못 보는 것: 카메라·마이크 실물, 실제 푸시 수신, 앱 링크 검증.
  #  💸 맥 빌드 시간을 쓴다(무료 월 500분). 필요할 때만 손으로 돌릴 것 — 자동 실행 걸지 마라.
  ios-simulator-screenshots:
    name: healwith iOS (시뮬레이터 화면 확인 · 서명 없음)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
      vars:
        # 진단 목적상 첫 화면을 로그인으로 고정한다(확인할 화면이 거기라서).
        # 실제 출시 빌드는 건드리지 않는다 — 이 워크플로 안에서만 덮어쓴다.
        DIAG_START_URL: "https://healwith.co.kr/login?focus=email"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 첫 화면을 로그인으로 (이 빌드 한정)
        script: |
          # server.url 만 바꿔치기. 시뮬레이터는 «탭»을 못 시키므로, 확인할 화면을 첫 화면으로 연다.
          node -e "
            const fs=require('fs');
            let s=fs.readFileSync('capacitor.config.ts','utf8');
            s=s.replace(\"url: 'https://healwith.co.kr'\", \"url: '\"+process.env.DIAG_START_URL+\"'\");
            fs.writeFileSync('capacitor.config.ts',s);
          "
          grep -n "url:" capacitor.config.ts | head -3
      - name: Capacitor iOS 동기화
        script: npx cap sync ios
      - name: 시뮬레이터용 빌드 (서명 없음)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: 시뮬레이터 띄우고 화면 찍기
        script: |
          set -e
          mkdir -p screenshots
          APP="$(find build/ios-sim/Build/Products -maxdepth 2 -name 'App.app' | head -1)"
          echo "앱 경로: $APP"

          # 노치 있는 기기 + 작은 기기 두 대로 본다.
          for DEV in "iPhone 15 Pro" "iPhone SE (3rd generation)"; do
            UDID="$(xcrun simctl list devices available | grep -m1 "$DEV (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
            if [ -z "$UDID" ]; then echo "⚠️ $DEV 없음 — 건너뜀"; continue; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" kr.co.healwith.app
            sleep 25   # 라이브 로드라 네트워크가 끝나야 화면이 뜬다
            SAFE_NAME="$(echo "$DEV" | tr ' ()' '___')"
            # 첫 화면 주소에 ?focus=email 이 붙어 있어 커서가 자동으로 들어간다 →
            # 앱 웹뷰는 사용자 탭 없이도 포커스로 키보드가 뜨므로, 이 한 장에
            # «키보드 올라온 상태의 배치»가 그대로 담긴다.
            # (simctl 에는 키보드를 토글하는 명령이 없다 — 그래서 화면 쪽에서 연다.)
            xcrun simctl io "$UDID" screenshot "screenshots/${SAFE_NAME}-01-login-keyboard.png"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/${SAFE_NAME}-02-settled.png"
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la screenshots
    artifacts:
      - screenshots/*.png
      - build/ios-sim/Build/Products/**/*.app
