[project]
name = "healo-live-translate"
version = "0.1.0"
description = "HEALO 원격협진 실시간 통역 에이전트 (LiveKit Agents + Gemini 3.5 Live Translate)"
requires-python = ">=3.11"
dependencies = [
    # LiveKit Agents 1.5 — AgentServer.rtc_session / rtc Room API
    "livekit-agents>=1.5,<2",
    "livekit",
    # Gemini Live API 클라이언트
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[tool.uv]
# 의존성 잠금은 `uv lock` 으로 생성. 배포는 LiveKit Cloud Agents(`lk agent deploy`).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
