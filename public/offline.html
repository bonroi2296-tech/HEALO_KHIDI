<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>healwith</title>
<!--
  «인터넷이 끊겼을 때» 화면 — 두 곳이 같이 쓴다.
    1) 스토어 앱: capacitor.config.ts 의 server.errorPath 가 이 파일을 가리킨다.
    2) 홈화면 추가(PWA): public/sw.js 의 OFFLINE_URL.

  ⚠️ 이 파일은 오프라인에서 열린다 → **바깥 것(웹폰트·이미지·스크립트)을 절대 참조하지 마라.**
     전부 이 파일 안에 있어야 한다.

  ⚠️ 담지 않는 것 (2026-07-28 결정):
     - 예약된 상담 시각·지난 대화: 앱이 라이브 로드라 기기에 저장된 게 없다. 있는 척하면 거짓말.
     - 「24시간 연락 가능」류 문구: 1인 운영이라 지킬 수 없는 약속(의료 안전 규칙).
  ※ 2026-07-28 이전 판에는 제목에 옛 브랜드 「HEALO」가 남아 있었다(검사기가 .html 을 안 봐서 살아남음).
-->
<style>
  :root { --teal:#0d9488; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px));
    -webkit-text-size-adjust:100%;
  }
  .wrap{width:100%;max-width:380px;text-align:center}
  .mark{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--teal);margin-bottom:28px}
  .mark span{color:var(--ink);font-weight:700}
  .icon{width:56px;height:56px;margin:0 auto 20px;color:var(--muted)}
  h1{font-size:19px;line-height:1.45;margin:0 0 10px;font-weight:700}
  p{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 28px}
  button{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:#0f766e}
  .site{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .site b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">healwith<span> · 힐위드</span></div>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M2 8.8a16 16 0 0 1 20 0" opacity=".35"/>
      <path d="M5 12.3a11 11 0 0 1 14 0" opacity=".6"/>
      <path d="M8.5 15.8a6 6 0 0 1 7 0"/>
      <circle cx="12" cy="19.5" r="1.1" fill="currentColor" stroke="none"/>
      <path d="M3 3l18 18"/>
    </svg>
    <h1 id="t"></h1>
    <p id="b"></p>
    <button id="r" type="button"></button>
    <div class="site" id="s"></div>
  </div>

<script>
(function () {
  // 활성 6개 언어. 기기 언어로 고르고, 모르면 러시아어(주 타겟)로.
  var T = {
    ru: { t:"Нет подключения к интернету", b:"Проверьте Wi-Fi или мобильный интернет и попробуйте снова.", r:"Повторить", s:"Также доступно в браузере:" },
    kz: { t:"Интернет байланысы жоқ", b:"Wi-Fi немесе мобильді интернетті тексеріп, қайта көріңіз.", r:"Қайталау", s:"Браузерде де қолжетімді:" },
    en: { t:"No internet connection", b:"Check your Wi-Fi or mobile data, then try again.", r:"Try again", s:"Also available in your browser:" },
    ko: { t:"인터넷에 연결되어 있지 않습니다", b:"와이파이나 모바일 데이터를 확인한 뒤 다시 시도해 주세요.", r:"다시 시도", s:"브라우저에서도 이용할 수 있습니다:" },
    zh: { t:"无网络连接", b:"请检查 Wi-Fi 或移动数据后重试。", r:"重试", s:"也可在浏览器中访问：" },
    ja: { t:"インターネットに接続されていません", b:"Wi-Fi またはモバイルデータを確認して、もう一度お試しください。", r:"再試行", s:"ブラウザでもご利用いただけます:" }
  };
  var code = (navigator.language || "ru").toLowerCase().slice(0, 2);
  if (code === "kk") code = "kz";  // 카자흐: 기기는 kk, 우리 활성코드는 kz
  var m = T[code] || T.ru;

  document.documentElement.lang = (code === "kz") ? "kk" : code;
  document.getElementById("t").textContent = m.t;
  document.getElementById("b").textContent = m.b;
  document.getElementById("r").textContent = m.r;
  document.getElementById("s").innerHTML = m.s + " <b>healwith.co.kr</b>";

  // 이 화면을 그냥 새로고침하면 이 화면이 또 나온다 → 실제 사이트를 다시 부른다.
  document.getElementById("r").addEventListener("click", function () {
    location.replace("https://healwith.co.kr/");
  });
})();
</script>
</body>
</html>
