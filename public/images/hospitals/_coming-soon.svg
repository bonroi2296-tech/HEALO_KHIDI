<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Photo coming soon">
  <rect width="800" height="500" fill="#f1f5f9"/>
  <g transform="translate(400 200)" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- hospital building -->
    <rect x="-78" y="-70" width="156" height="150" fill="#e2e8f0" stroke="#cbd5e1"/>
    <!-- medical cross -->
    <g stroke="#94a3b8" stroke-width="11">
      <line x1="0" y1="-44" x2="0" y2="-4"/>
      <line x1="-20" y1="-24" x2="20" y2="-24"/>
    </g>
    <!-- windows -->
    <g stroke="#cbd5e1" stroke-width="7">
      <line x1="-52" y1="14" x2="-30" y2="14"/>
      <line x1="-11" y1="14" x2="11" y2="14"/>
      <line x1="30" y1="14" x2="52" y2="14"/>
      <line x1="-52" y1="44" x2="-30" y2="44"/>
      <line x1="-11" y1="44" x2="11" y2="44"/>
      <line x1="30" y1="44" x2="52" y2="44"/>
    </g>
  </g>
  <text x="400" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#94a3b8">Photo coming soon</text>
</svg>
