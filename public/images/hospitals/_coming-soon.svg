<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="이미지 준비 중">
  <rect width="800" height="500" fill="#f1f5f9"/>
  <g transform="translate(400 210)" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- hospital building -->
    <rect x="-78" y="-70" width="156" height="150" fill="#e2e8f0" stroke="#cbd5e1"/>
    <!-- medical cross -->
    <g stroke="#94a3b8" stroke-width="11">
      <line x1="0" y1="-44" x2="0" y2="-4"/>
      <line x1="-20" y1="-24" x2="20" y2="-24"/>
    </g>
    <!-- windows -->
    <g stroke="#cbd5e1" stroke-width="7">
      <line x1="-52" y1="14" x2="-30" y2="14"/>
      <line x1="-11" y1="14" x2="11" y2="14"/>
      <line x1="30" y1="14" x2="52" y2="14"/>
      <line x1="-52" y1="44" x2="-30" y2="44"/>
      <line x1="-11" y1="44" x2="11" y2="44"/>
      <line x1="30" y1="44" x2="52" y2="44"/>
    </g>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#94a3b8">이미지 준비 중</text>
  <text x="400" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Photos coming soon</text>
</svg>
