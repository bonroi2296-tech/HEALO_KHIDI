# HEALO E2E 자동화
#
# 트리거:
#   1. PR → main: smoke 테스트 (핵심 5분 내)
#   2. main push: 전체 E2E (10~15분)
#   3. 매일 04:00 KST (UTC 19:00): 프로덕션 대상 full E2E
#
# 실패 시:
#   - GitHub Issue 자동 생성
#   - Slack webhook 알림 (SLACK_WEBHOOK_URL secret 있으면)
#   - 스크린샷·trace.zip 아티팩트 첨부

name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 매일 KST 04:00 = UTC 19:00 전날
    - cron: "0 19 * * *"
  # 수동 실행 — 작업본(브랜치)에서도 전체 E2E를 돌려볼 수 있게 (테스트 수리 검증 루프용)
  workflow_dispatch:

# 실패 시 GitHub Issue 자동 생성에 필요 (기본 토큰은 read-only라 그동안 이슈 생성이 403으로 죽어 있었음)
permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: PR smoke (핵심만, 빠르게)
  # ─────────────────────────────────────────────
  smoke:
    name: Smoke Tests (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (chromium만)
        run: npx playwright install chromium --with-deps

      - name: Smoke E2E 실행 (@smoke 태그만)
        run: npm run e2e:smoke
        env:
          CI: "1"
          E2E_SKIP_SERVER: "0"
          E2E_BASE_URL: "http://localhost:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          # Supabase URL·anon 은 공개키(브라우저 노출) → 시크릿 미설정 시 리터럴 폴백(테스트 서버 기동 필수).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2d3dsa2F3YXhhYmh0dW1qaHJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNzMwMDksImV4cCI6MjA5MDY0OTAwOX0.zwakXKKLkQqRpaa5F7qehAyMVpvvvJMCtaKsPSsQBsI' }}
          # 민감키 — 시크릿 필수(테스트 서버 server-side 라우트·PII 복호화용).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}

      - name: 실패 아티팩트 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Slack 알림 (실패 시)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *HEALO E2E Smoke 실패* — PR #${{ github.event.number }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그 보기>",
              "attachments": [{"color": "danger", "text": "Branch: ${{ github.head_ref }}"}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (실패 시)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"❌ HEALO E2E Smoke 실패 (PR #${{ github.event.number }})\",
              \"html\": \"<h2>HEALO 자동 검사 실패</h2><p><strong>유형:</strong> PR Smoke Test</p><p><strong>브랜치:</strong> ${{ github.head_ref }}</p><p><strong>PR:</strong> #${{ github.event.number }}</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"

  # ─────────────────────────────────────────────
  # JOB 2: Full E2E (main push)
  # ─────────────────────────────────────────────
  full:
    name: Full E2E (main push)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: Full E2E 실행
        run: npm run e2e
        env:
          CI: "1"
          E2E_SKIP_SERVER: "0"
          E2E_BASE_URL: "http://localhost:3000"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          # Supabase URL·anon 은 공개키 → 시크릿 미설정 시 리터럴 폴백(테스트 서버 기동 필수).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2d3dsa2F3YXhhYmh0dW1qaHJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNzMwMDksImV4cCI6MjA5MDY0OTAwOX0.zwakXKKLkQqRpaa5F7qehAyMVpvvvJMCtaKsPSsQBsI' }}
          # 민감키 — 시크릿 필수(server-side 라우트·PII 복호화).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}

      - name: 테스트 리포트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: 실패 trace 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: GitHub Issue 자동 생성 (실패 시)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## E2E 테스트 실패 자동 리포트',
              '',
              `- **커밋**: ${context.sha.substring(0, 7)}`,
              `- **브랜치**: ${context.ref}`,
              `- **실행 시각**: ${new Date().toISOString()}`,
              `- **Actions 로그**: [바로가기](${runUrl})`,
              '',
              '### 확인 사항',
              '- [ ] 스크린샷/trace 아티팩트 확인',
              '- [ ] 변경된 코드와 연관성 파악',
              '- [ ] 환경변수 누락 여부 확인',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 E2E 실패 — ${new Date().toLocaleDateString('ko-KR')} main push`,
              body,
              labels: ['e2e-failure', 'automated'],
            });

      - name: Slack 알림 (실패 시)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🔴 *HEALO E2E Full 실패* — main 브랜치\n커밋: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그>",
              "attachments": [{"color": "danger", "text": "전체 E2E 중 하나 이상 실패. 이슈가 자동 생성되었습니다."}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (실패 시)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"🔴 HEALO E2E Full 실패 (main push)\",
              \"html\": \"<h2>HEALO main 브랜치 E2E 실패</h2><p><strong>유형:</strong> Full E2E (main push)</p><p><strong>커밋:</strong> ${{ github.sha }}</p><p>전체 E2E 중 하나 이상 실패. GitHub Issue 자동 생성됨.</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"

  # ─────────────────────────────────────────────
  # JOB 3: 프로덕션 대상 cron (매일 새벽 4시 KST)
  # ─────────────────────────────────────────────
  production-nightly:
    name: Production Nightly E2E (cron)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: Full E2E — 프로덕션 대상
        run: npm run e2e
        env:
          CI: "1"
          # 프로덕션 URL 대상 (서버 자동 시작 안 함)
          E2E_BASE_URL: ${{ secrets.E2E_PROD_BASE_URL || 'https://healo-khidi.vercel.app' }}
          E2E_SKIP_SERVER: "1"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: 프로덕션 리포트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: GitHub Issue 자동 생성 (실패 시)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🌙 프로덕션 야간 E2E 실패',
              '',
              `- **대상**: https://healo-khidi.vercel.app`,
              `- **실행 시각 (KST)**: ${new Date(Date.now() + 9*3600000).toLocaleString('ko-KR')}`,
              `- **Actions 로그**: [바로가기](${runUrl})`,
              '',
              '> 프로덕션 서비스 이상 가능성. 즉시 확인 필요.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🌙 프로덕션 E2E 실패 — ${new Date().toLocaleDateString('ko-KR')}`,
              body,
              labels: ['e2e-failure', 'production', 'urgent'],
            });

      - name: Slack 알림 (실패 시)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 *프로덕션 E2E 실패* — 야간 자동 점검\n대상: https://healo-khidi.vercel.app\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 보기>",
              "attachments": [{"color": "danger", "text": "프로덕션 서비스 이상 가능성. 즉시 확인 필요합니다."}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (프로덕션 실패 — URGENT)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"🚨 [URGENT] HEALO 프로덕션 E2E 실패\",
              \"html\": \"<h2 style='color:red'>🚨 프로덕션 서비스 이상 가능성</h2><p><strong>유형:</strong> 야간 자동 점검 (cron)</p><p><strong>대상:</strong> https://healo-khidi.vercel.app</p><p><strong>일시 (KST):</strong> $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M:%S')</p><p style='color:red'><strong>즉시 확인 필요.</strong> GitHub Issue urgent 라벨로 자동 생성됨.</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"
