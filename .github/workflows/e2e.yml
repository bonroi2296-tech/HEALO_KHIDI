# HEALO E2E 자동화
#
# 트리거:
#   1. PR → main: smoke 테스트 (핵심 5분 내)
#   2. main push: 전체 E2E (10~15분)
#   3. 매일 04:00 KST (UTC 19:00): 프로덕션 대상 full E2E
#
# 실패 시:
#   - GitHub Issue 자동 생성
#   - Slack webhook 알림 (SLACK_WEBHOOK_URL secret 있으면)
#   - 스크린샷·trace.zip 아티팩트 첨부

name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 매일 KST 04:00 = UTC 19:00 전날
    - cron: "0 19 * * *"
  # 수동 실행 — 작업본(브랜치)에서도 전체 E2E를 돌려볼 수 있게 (테스트 수리 검증 루프용)
  workflow_dispatch:
    inputs:
      target:
        description: "대상 (local=러너 dev 서버 / production=실서비스, 로봇 통화·통역봇 포함)"
        type: choice
        default: local
        options: [local, production]
        required: false

# 실패 시 GitHub Issue 자동 생성에 필요 (기본 토큰은 read-only라 그동안 이슈 생성이 403으로 죽어 있었음)
permissions:
  contents: read
  issues: write

concurrency:
  # ⚠️ 이벤트 종류를 그룹 키에 포함한다(2026-07-27 실측으로 추가).
  #    전에는 `e2e-${{ github.ref }}` 뿐이라, main 을 대상으로 **수동 실행**(프로덕션 점검)을
  #    돌려놓으면 그 사이 아무 PR 이나 main 에 머지되는 순간 push 실행이 같은 그룹으로 들어와
  #    **수동 실행을 죽였다.** 실제로 그랬다: 수동 실행 중 #1002 머지(01:54:46) → 16초 뒤 취소.
  #    로봇 통화 3회가 다 돌았는데 결과를 한 글자도 못 건졌다.
  #    main 은 여러 세션이 계속 머지하는 곳이라, 이벤트를 안 나누면 수동 점검이 사실상 불가능하다.
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# 🚫 concurrency 로 「DB 동시 진입 상한」을 만들려는 시도는 하지 마라 (2026-07-27 실패 기록)
#
# 하고 싶었던 것: 자동검사는 앱을 러너 로컬에 띄우면서 **DB 는 프로덕션을 그대로** 문다
#   (연습용 DB 가 없다). 위 workflow 레벨 그룹은 «같은 브랜치» 안에서만 중복을 지우므로
#   작업본이 여러 개면 그만큼의 스위트가 같은 DB 로 동시에 들어간다(KNOWN_ISSUES 항목).
#
# 시도했다가 되돌린 것(#1008 → 즉시 revert): 세 잡에 job 레벨
#   `concurrency: {group: e2e-prod-db, cancel-in-progress: false}` 를 걸어 전역 직렬화.
#
# ❌ 왜 실패했나 — **concurrency 의 대기 슬롯은 1개뿐이다.**
#   `cancel-in-progress: false` 는 «실행 중인 것»만 지킨다. **«대기 중인 것»은 못 지킨다.**
#   공식 문서: *"Any previously pending job or workflow in the concurrency group will be canceled."*
#   → 새 실행이 대기열에 들어오는 순간 **먼저 기다리던 실행이 취소**되고, 그 취소는 「실패」로
#     기록돼 해당 PR 이 BLOCKED 가 된다. workflow 레벨에서 «남의 PR 을 내 PR 이 죽인다»는
#     재앙을 정확히 짚고 피했는데, **job 레벨 대기열 밀어내기로 같은 재앙이 뒷문으로 들어왔다.**
#   실측(머지 03:04:40 직후): 03:05 app-registration / 03:10 docs/postmortems /
#     03:13 backoffice-hierarchy / 03:14 a11y-scanner 가 전부
#     `Canceling since a higher priority waiting request for e2e-prod-db exists` 로 취소.
#     **열린 PR 5개가 동시에 막혔다.** 머지 전(02:49·02:50·02:55)엔 서로 다른 브랜치가
#     동시에 돌아도 전부 success 였다.
#   ⚠️ 당시 주석에 적었던 «몰릴 땐 줄을 서지만 대체로 흘러간다»는 **틀린 전제**였다
#      (가동률 53% 산수는 «줄이 서진다»를 전제했는데 줄이 안 선다).
#
# ✅ 다음에 이 문제를 다시 풀 사람에게: **concurrency 로는 «동시 N개»를 표현할 수 없다.**
#   다른 수단이 필요하다 — 예: ①self-hosted 러너 풀 크기로 제한 ②외부 잠금(뮤텍스 액션 등)
#   ③근본책 = KNOWN_ISSUES ②번 **E2E 를 프로덕션 DB 에서 떼어내기**(별도 Supabase, 시드 이관).
#   ③이 정공법이다. ①②는 또 다른 방식으로 PR 을 막을 수 있으니 반드시 «막힘» 시나리오부터 검증할 것.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: PR smoke (핵심만, 빠르게)
  # ─────────────────────────────────────────────
  smoke:
    name: Smoke Tests (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (chromium만)
        run: npx playwright install chromium --with-deps

      # 시험을 돌리기 «전에» 검사 전용 DB 가 코드가 아는 스키마와 어긋나지 않는지 본다.
      # 왜 (2026-08-04): inquiries 에 새 컬럼 4개를 실서비스에만 넣었더니, 그 컬럼을 포함한
      #   조회가 검사 전용 DB 에서 «통째로» 실패해 문의 상세가 「조회 중 문제가 발생했습니다」
      #   한 장이 됐다. 시험은 「버튼을 못 찾음」이라고만 말해서 원인을 찾는 데 두 번 헛짚었다.
      #   이 단계는 어긋난 «컬럼 이름»을 먼저 대준다.
      - name: 검사 전용 DB 스키마 대조 (없는 컬럼 먼저 잡기)
        run: node scripts/check-e2e-schema.mjs
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 파일 첨부 검사가 «프론트 문제»처럼 보이는 걸 막는다.
      # 왜 (2026-08-30): chat-file-upload 가 「파일명 칩이 안 뜬다」로 며칠 빨간불이었는데
      #   진짜 원인은 서버의 `[directUpload] sign error: ... does not exist (404)` 였다.
      #   원인을 좁히는 데 후보 셋(통 없음·다른 프로젝트·경로 오류)을 반증해야 했다.
      #   열쇠가 죽으면 «여러 검사가 엉뚱한 이유로» 빨개지므로 여기서 먼저 가린다.
      # ⚠️ 비밀값은 안 찍는다 — 형식·길이·되나 안 되나만 낸다.
      # continue-on-error: 진단이지 관문이 아니다. 이것 때문에 나머지 검사(141개)를 막지 않는다.
      #
      # 🛑 2026-08-31: 그 «안 막는다»가 이틀을 잡아먹었다. 이 단계는 8/30 부터 매번 정확히
      #    「🔴 서명 URL 발급 실패」를 찍고 있었는데, continue-on-error 라 작업 결론에 안 뜨고
      #    로그 수천 줄에 묻혀서 아무도 안 봤다. E2E 는 「파일 첨부 시험 실패」로만 보였다.
      #    진범은 **검사 전용 프로젝트에 통(bucket)이 0개**인 것이었다(실서비스엔 5개).
      #    → 이제 스크립트가 ①열쇠 문제와 통 없음을 «갈라서» 말하고 ②검사 전용 프로젝트면
      #      통을 직접 만들고 ③실패는 `::error::` 로 올려 요약 화면에 뜨게 한다.
      #      continue-on-error 는 그대로 둔다 — 막는 게 아니라 «보이게» 하는 것이 답이었다.
      - name: 저장소 열쇠·통이 실제로 먹히나 (첨부 검사 전에 미리)
        continue-on-error: true
        run: node scripts/check-e2e-storage.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Smoke E2E 실행 (@smoke 태그만)
        run: npm run e2e:smoke
        env:
          CI: "1"
          E2E_SKIP_SERVER: "0"
          E2E_BASE_URL: "http://localhost:3000"
          # 🛑 이 잡만 쓰는 회수제한 통 이름. 없으면 «동시에 도는 다른 실행»과 접수 한도를 나눠 쓴다.
          #    러너의 서버는 localhost 라 IP 가 늘 ::1 이고 통은 검사 전용 DB 한 곳에 있어서,
          #    통 이름이 모든 실행에서 `inquiry:::1` 로 같아진다. 의뢰서 접수는 1분에 5회인데
          #    스모크 한 번이 이미 4회를 쓴다 → 겹치면 뒤에 온 쪽이 429 를 맞고 접수 화면이 멈춘다
          #    (2026-08-31 실측: 27초 차이로 올라간 PR 두 개가 같은 분에 8회를 넣어 3회 연속 실패).
          #    ⚠️ job 까지 넣는 이유: 같은 실행 안의 smoke·blast-radius 도 동시에 돈다.
          #    ⚠️ 실서비스 대상(아래 nightly)엔 넣지 마라 — 서버가 Vercel 이라 이 값이 안 닿고,
          #       닿는다 해도 «실제 손님과 같은 통»으로 재야 진짜 한도를 재는 것이다.
          RATE_LIMIT_NAMESPACE: "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          # 2026-07-29 추가 — 시크릿만 등록하고 여기 안 넘겨서 병원 검사가 계속 조용히 스킵됐다.
          E2E_HOSPITAL_EMAIL: ${{ secrets.E2E_HOSPITAL_EMAIL }}
          E2E_HOSPITAL_PASSWORD: ${{ secrets.E2E_HOSPITAL_PASSWORD }}
          # ⚠️ 검사는 «검사 전용 DB»(healo-e2e)를 본다 — 실서비스 DB 를 물면 부하가 그대로 손님에게 간다
          # (2026-07-24 DB 멈춤 때 부하 주체가 이 검사였다). E2E_ 접두 시크릿이 있으면 그쪽이 이긴다.
          # 폴백은 «검사 전용 값이 아직 없을 때»만 쓰이는 옛 경로 — 새로 설정하면 자연히 안 쓰인다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2d3dsa2F3YXhhYmh0dW1qaHJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNzMwMDksImV4cCI6MjA5MDY0OTAwOX0.zwakXKKLkQqRpaa5F7qehAyMVpvvvJMCtaKsPSsQBsI' }}
          # 민감키 — 시크릿 필수(테스트 서버 server-side 라우트·PII 복호화용).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}

      - name: 실패 아티팩트 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Slack 알림 (실패 시)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ *HEALO E2E Smoke 실패* — PR #${{ github.event.number }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그 보기>",
              "attachments": [{"color": "danger", "text": "Branch: ${{ github.head_ref }}"}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (실패 시)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"❌ HEALO E2E Smoke 실패 (PR #${{ github.event.number }})\",
              \"html\": \"<h2>HEALO 자동 검사 실패</h2><p><strong>유형:</strong> PR Smoke Test</p><p><strong>브랜치:</strong> ${{ github.head_ref }}</p><p><strong>PR:</strong> #${{ github.event.number }}</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"

  # ─────────────────────────────────────────────
  # JOB 1-b: 반경 안 여정 검사 (파생 파손을 «합치기 전»에 잡는 자리)
  #
  # 왜 별도 잡인가 (첫 판의 실수를 여기 남긴다):
  #   처음엔 이걸 위 smoke 잡 «안»에 붙이고 「비차단」이라고 적었다. 그런데 이 저장소의
  #   검사 설정은 자동검사 환경에서 서버를 재사용하지 않는다(`reuseExistingServer: !CI`).
  #   즉 dev 서버를 «한 번 더» 띄운다 — 부팅 상한만 240초다. 빠른 검사(5분+부팅) 뒤에
  #   부팅 4분 + 검사 6개가 더 붙으면 잡 상한을 넘긴다.
  #   ⚠️ `continue-on-error` 는 «단계»만 덮지 «잡 시간초과»는 못 덮는다.
  #      그러면 「비차단」이라고 적어놓고 실제로는 멀쩡한 신청서를 빨간불로 만든다.
  #   → 별도 잡으로 떼면 ①시간이 서로 안 먹고 ②빠른 검사와 «병렬»로 돌아 총 시간도 안 늘고
  #     ③잡 레벨 continue-on-error 로 진짜 비차단이 된다.
  #
  # 무엇을 도나: 이번 변경이 실제로 닿는 화면의 여정 검사만. 신청서엔 빠른 검사 24개만 돌고
  #   전체 여정 검사는 본판에 합친 «뒤»에만 돌아서, 파생 파손은 구조적으로 머지 후에야
  #   발견됐다 — 파생 파손은 정의상 «내가 안 열어본 화면»에서 나므로 빠른 검사 목록에
  #   있을 이유가 없다. 그 구조적 지연을 앞당기는 자리다.
  #
  # 단위 검사는 --skip-unit — 본 검사(ci.yml)가 이미 전부 돈다(중복 낭비).
  # 한 주 돌려 헛경보 0 이면 continue-on-error 를 떼고 차단으로 승격.
  # ─────────────────────────────────────────────
  blast:
    name: Blast Radius E2E (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 본판과 비교할 기준점이 필요하다(얕게 받으면 반경이 «변경 0개»로 뜬다)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (chromium만)
        run: npx playwright install chromium --with-deps

      - name: 반경 안 여정 검사 (이번 변경이 닿는 화면만 골라서)
        run: |
          BASE=origin/main
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=HEAD~1
          node scripts/blast-verify.mjs --base "$BASE" --max 6 --skip-unit 2>&1 | tee /tmp/blast-verify.log
        continue-on-error: true
        env:
          CI: "1"
          E2E_SKIP_SERVER: "0"
          E2E_BASE_URL: "http://localhost:3000"
          # 🛑 이 잡만 쓰는 회수제한 통 이름. 없으면 «동시에 도는 다른 실행»과 접수 한도를 나눠 쓴다.
          #    러너의 서버는 localhost 라 IP 가 늘 ::1 이고 통은 검사 전용 DB 한 곳에 있어서,
          #    통 이름이 모든 실행에서 `inquiry:::1` 로 같아진다. 의뢰서 접수는 1분에 5회인데
          #    스모크 한 번이 이미 4회를 쓴다 → 겹치면 뒤에 온 쪽이 429 를 맞고 접수 화면이 멈춘다
          #    (2026-08-31 실측: 27초 차이로 올라간 PR 두 개가 같은 분에 8회를 넣어 3회 연속 실패).
          #    ⚠️ job 까지 넣는 이유: 같은 실행 안의 smoke·blast-radius 도 동시에 돈다.
          #    ⚠️ 실서비스 대상(아래 nightly)엔 넣지 마라 — 서버가 Vercel 이라 이 값이 안 닿고,
          #       닿는다 해도 «실제 손님과 같은 통»으로 재야 진짜 한도를 재는 것이다.
          RATE_LIMIT_NAMESPACE: "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          E2E_HOSPITAL_EMAIL: ${{ secrets.E2E_HOSPITAL_EMAIL }}
          E2E_HOSPITAL_PASSWORD: ${{ secrets.E2E_HOSPITAL_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}
      - name: 결과를 실행 화면 요약에 남긴다
        if: always()
        run: |
          {
            echo "## 🧪 반경 안 여정 검사"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' /tmp/blast-verify.log 2>/dev/null || echo "(로그 없음 — 반경이 비었거나 앞 단계가 못 돌았다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # JOB 2: Full E2E (main push)
  # ─────────────────────────────────────────────
  full:
    name: Full E2E (main push)
    # 수동 실행은 target=local 일 때만 이 잡(러너 dev 서버). production 이면 아래 JOB 3 로 간다.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      # 파일 첨부 검사가 «프론트 문제»처럼 보이는 걸 막는다.
      # 왜 (2026-08-30): chat-file-upload 가 「파일명 칩이 안 뜬다」로 며칠 빨간불이었는데
      #   진짜 원인은 서버의 `[directUpload] sign error: ... does not exist (404)` 였다.
      #   원인을 좁히는 데 후보 셋(통 없음·다른 프로젝트·경로 오류)을 반증해야 했다.
      #   열쇠가 죽으면 «여러 검사가 엉뚱한 이유로» 빨개지므로 여기서 먼저 가린다.
      # ⚠️ 비밀값은 안 찍는다 — 형식·길이·되나 안 되나만 낸다.
      # continue-on-error: 진단이지 관문이 아니다. 이것 때문에 나머지 검사(141개)를 막지 않는다.
      #
      # 🛑 2026-08-31: 그 «안 막는다»가 이틀을 잡아먹었다. 이 단계는 8/30 부터 매번 정확히
      #    「🔴 서명 URL 발급 실패」를 찍고 있었는데, continue-on-error 라 작업 결론에 안 뜨고
      #    로그 수천 줄에 묻혀서 아무도 안 봤다. E2E 는 「파일 첨부 시험 실패」로만 보였다.
      #    진범은 **검사 전용 프로젝트에 통(bucket)이 0개**인 것이었다(실서비스엔 5개).
      #    → 이제 스크립트가 ①열쇠 문제와 통 없음을 «갈라서» 말하고 ②검사 전용 프로젝트면
      #      통을 직접 만들고 ③실패는 `::error::` 로 올려 요약 화면에 뜨게 한다.
      #      continue-on-error 는 그대로 둔다 — 막는 게 아니라 «보이게» 하는 것이 답이었다.
      - name: 저장소 열쇠·통이 실제로 먹히나 (첨부 검사 전에 미리)
        continue-on-error: true
        run: node scripts/check-e2e-storage.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Full E2E 실행
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e-run.log
        env:
          CI: "1"
          E2E_SKIP_SERVER: "0"
          E2E_BASE_URL: "http://localhost:3000"
          # 🛑 이 잡만 쓰는 회수제한 통 이름. 없으면 «동시에 도는 다른 실행»과 접수 한도를 나눠 쓴다.
          #    러너의 서버는 localhost 라 IP 가 늘 ::1 이고 통은 검사 전용 DB 한 곳에 있어서,
          #    통 이름이 모든 실행에서 `inquiry:::1` 로 같아진다. 의뢰서 접수는 1분에 5회인데
          #    스모크 한 번이 이미 4회를 쓴다 → 겹치면 뒤에 온 쪽이 429 를 맞고 접수 화면이 멈춘다
          #    (2026-08-31 실측: 27초 차이로 올라간 PR 두 개가 같은 분에 8회를 넣어 3회 연속 실패).
          #    ⚠️ job 까지 넣는 이유: 같은 실행 안의 smoke·blast-radius 도 동시에 돈다.
          #    ⚠️ 실서비스 대상(아래 nightly)엔 넣지 마라 — 서버가 Vercel 이라 이 값이 안 닿고,
          #       닿는다 해도 «실제 손님과 같은 통»으로 재야 진짜 한도를 재는 것이다.
          RATE_LIMIT_NAMESPACE: "ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          # 2026-07-29 추가 — 시크릿만 등록하고 여기 안 넘겨서 병원 검사가 계속 조용히 스킵됐다.
          E2E_HOSPITAL_EMAIL: ${{ secrets.E2E_HOSPITAL_EMAIL }}
          E2E_HOSPITAL_PASSWORD: ${{ secrets.E2E_HOSPITAL_PASSWORD }}
          # Supabase URL·anon 은 공개키 → 시크릿 미설정 시 리터럴 폴백(테스트 서버 기동 필수).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hvwwlkawaxabhtumjhrg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2d3dsa2F3YXhhYmh0dW1qaHJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNzMwMDksImV4cCI6MjA5MDY0OTAwOX0.zwakXKKLkQqRpaa5F7qehAyMVpvvvJMCtaKsPSsQBsI' }}
          # 민감키 — 시크릿 필수(server-side 라우트·PII 복호화).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}

      # 🩺 「1차 실패 → retry 로 통과」한 테스트를 잡 요약에 띄운다.
      #    왜: retries=2 는 공유 프로덕션 DB 의 진짜 간헐 실패를 흡수하려고 켠 것인데,
      #    **깨진 테스트까지 같이 덮는다.** 2026-07-27 게스트 초대 스펙 2건이 정확히 그랬다 —
      #    최소 3번의 «초록» 뒤에서 매번 1차 실패하고 있었고, 아무도 못 봤다(POSTMORTEMS #132).
      #    합격/불합격은 안 바꾼다(진짜 인프라 흔들림으로 main 을 막으면 더 나쁨). 보이게만 한다.
      - name: 재시도로만 통과한 테스트 표시
        if: always()
        run: |
          grep -F '(retry #' e2e-run.log | grep -F '✓' > retried.txt || true
          if [ -s retried.txt ]; then
            {
              echo "### ⚠️ 재시도로만 통과한 테스트 — 깨진 테스트가 초록으로 위장 중일 수 있음"
              echo "1차에서 떨어지는 테스트는 «가끔 실패»가 아니라 보통 **경주(race)**다. 웹퍼스트 어서션으로 고칠 것."
              echo '```'
              cat retried.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 테스트 리포트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: 실패 trace 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: GitHub Issue 자동 생성 (실패 시)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## E2E 테스트 실패 자동 리포트',
              '',
              `- **커밋**: ${context.sha.substring(0, 7)}`,
              `- **브랜치**: ${context.ref}`,
              `- **실행 시각**: ${new Date().toISOString()}`,
              `- **Actions 로그**: [바로가기](${runUrl})`,
              '',
              '### 확인 사항',
              '- [ ] 스크린샷/trace 아티팩트 확인',
              '- [ ] 변경된 코드와 연관성 파악',
              '- [ ] 환경변수 누락 여부 확인',
            ].join('\n');

            // 같은 부류가 이미 열려 있으면 새 이슈 대신 거기에 코멘트 — 하루 10개+ 중복
            // 이슈가 쌓여 아무도 안 보게 되는 것 방지 (POSTMORTEMS #112)
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'e2e-failure,automated',
              state: 'open',
              per_page: 20,
              sort: 'created',
              direction: 'desc',
            });
            // listForRepo 는 라벨 일치 시 PR 도 반환 — 이슈만 남긴다 (독립 리뷰)
            const openIssues = existing.filter((i) => !i.pull_request);
            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 E2E 실패 — ${new Date().toLocaleDateString('ko-KR')} main push`,
                body,
                labels: ['e2e-failure', 'automated'],
              });
            }

      - name: Slack 알림 (실패 시)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🔴 *HEALO E2E Full 실패* — main 브랜치\n커밋: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|실행 로그>",
              "attachments": [{"color": "danger", "text": "전체 E2E 중 하나 이상 실패. 이슈가 자동 생성되었습니다."}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (실패 시)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"🔴 HEALO E2E Full 실패 (main push)\",
              \"html\": \"<h2>HEALO main 브랜치 E2E 실패</h2><p><strong>유형:</strong> Full E2E (main push)</p><p><strong>커밋:</strong> ${{ github.sha }}</p><p>전체 E2E 중 하나 이상 실패. GitHub Issue 자동 생성됨.</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"

  # ─────────────────────────────────────────────
  # JOB 3: 프로덕션 대상 cron (매일 새벽 4시 KST) + 수동(target=production)
  #
  # ⚠️ 수동 실행을 연 이유(2026-07-27): 예약 실행(cron)은 **기본 브랜치에서만** 돈다.
  #    그래서 로봇 통화·통역봇 검증을 고쳐도 «머지하기 전엔 한 번도 못 돌려보는» 상태였다
  #    (작업본에서 검증 불가 → 검증 안 된 채로 머지 → 다음날 아침에야 결과 확인).
  #    target=production 으로 수동 실행하면 작업본의 테스트 코드로 실서비스를 즉시 점검할 수 있다.
  #    (대상은 언제나 배포된 프로덕션 앱이다 — 작업본은 «테스트 코드»만 제공한다.)
  # ─────────────────────────────────────────────
  production-nightly:
    name: Production Nightly E2E (cron)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      # 2026-08-27 재발 방지: 열쇠가 빠지면 준비 단계가 «조용히 건너뛰고» 그 역할 스펙이
      # 매일 밤 한 번도 안 도는데 아무도 모른다(닷새간 실제로 그랬다). 침묵 대신 여기서 멈춘다.
      - name: 역할 계정 열쇠 점검 (하나라도 없으면 여기서 멈춘다)
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_HOSPITAL_EMAIL: ${{ secrets.E2E_HOSPITAL_EMAIL }}
        run: |
          missing=""
          for k in E2E_TEST_USER_EMAIL E2E_ADMIN_EMAIL E2E_COORDINATOR_EMAIL                    E2E_AGENCY_EMAIL E2E_CLINIC_EMAIL E2E_HOSPITAL_EMAIL; do
            if [ -z "$(printenv "$k")" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::이 잡에 안 넘어온 열쇠:$missing (저장소 비밀값에는 있는데 잡 env 에서 빠졌는지부터 보라)"
            exit 1
          fi
          echo "6개 역할 열쇠 모두 확인됨"

      - name: Full E2E — 프로덕션 대상
        run: npm run e2e
        env:
          CI: "1"
          # 프로덕션 URL 대상 (서버 자동 시작 안 함)
          E2E_BASE_URL: ${{ secrets.E2E_PROD_BASE_URL || 'https://www.healwith.co.kr' }}
          E2E_SKIP_SERVER: "1"
          # 로봇 통화 스펙(안전망 ②)은 프로덕션 야간 잡에서만 — Full E2E 의 로컬 dev 서버엔
          # LiveKit env 가 없어 게스트 입장이 구조적으로 503 (독립 리뷰 적발)
          E2E_ROBOT_CALL: "1"
          # 통역봇 실참여 검증(로봇 통화 5단계) — 켜기·끄기·통역 자막까지 본다.
          # ✅ 이제 **켜둔 채로 둬도 안전하다** (2026-07-28, PO 요청으로 복구).
          #    스펙이 서버 응답(`enabled:false`)을 보고 «통역이 꺼져 있으면 스스로 건너뛴다».
          #    예전엔 이 값을 사람이 스위치와 같이 내려야 했고, 그걸 잊은 하루가
          #    새벽 긴급 이메일(이슈 #1061)로 돌아왔다 — 반성문 #138.
          #    ▶ 그러니 `LIVE_TRANSLATE_ENABLED` 를 켜고 끌 때 **여기는 안 건드려도 된다.**
          E2E_INTERPRETER: "1"
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # 2026-08-27: 이 네 역할이 여기에만 빠져 있어서 야간 검사가 매일 빨간불이었다.
          # 준비 단계가 조용히 건너뛰고(코디·에이전시·의료기관·병원), 의뢰서 스펙만
          # 폴백 UI 로그인으로 30초를 기다리다 실패 → 매일 [URGENT] 메일.
          # 낮에 도는 Smoke·Full 잡에는 원래 다 있었다(122·238·298줄 근처).
          E2E_COORDINATOR_EMAIL: ${{ secrets.E2E_COORDINATOR_EMAIL }}
          E2E_COORDINATOR_PASSWORD: ${{ secrets.E2E_COORDINATOR_PASSWORD }}
          E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
          E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
          E2E_CLINIC_EMAIL: ${{ secrets.E2E_CLINIC_EMAIL }}
          E2E_CLINIC_PASSWORD: ${{ secrets.E2E_CLINIC_PASSWORD }}
          E2E_HOSPITAL_EMAIL: ${{ secrets.E2E_HOSPITAL_EMAIL }}
          E2E_HOSPITAL_PASSWORD: ${{ secrets.E2E_HOSPITAL_PASSWORD }}

      # 검사가 «통과했을 때만» 자기가 만든 시험 문의를 치운다 (PO 지시 2026-08-25:
      # 「테스트하고 이상 없으면 정리해, 너무 지저분해진다」).
      # 실패한 날은 일부러 남긴다 — 무엇이 어디서 끊겼는지 봐야 하니까.
      # 남은 것도 30일 지나면 매일 도는 정리(purge-recordings cron)가 치운다(안전망).
      - name: 검사가 만든 시험 문의 정리 (통과했을 때만)
        if: success() && github.event_name == 'schedule'
        run: npx tsx scripts/purge-test-inquiries.mjs --live --no-backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}

      - name: 프로덕션 리포트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      # 경보가 「늑대소년」이 되지 않게: 실서비스가 살아 있는지부터 재고, 그 결과를
      # 이슈·메일 «제목»에 넣는다. 닷새 연속 [URGENT] 였지만 실서비스는 내내 정상이었다.
      - name: 실서비스 생존 확인 (진짜 장애인지 검사 문제인지 가른다)
        id: prodhealth
        if: failure() && github.event_name == 'schedule'
        run: |
          code=$(curl -sL -m 20 -o /dev/null -w '%{http_code}' https://www.healwith.co.kr/api/health || echo 000)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "subject=⚠️ HEALO 야간 검사 실패 (실서비스는 정상)" >> "$GITHUB_OUTPUT"
            echo "verdict=🟢 실서비스는 살아 있다(/api/health 200). 검사 쪽 문제일 가능성이 크다." >> "$GITHUB_OUTPUT"
          else
            echo "subject=🚨 [URGENT] HEALO 프로덕션 응답 없음" >> "$GITHUB_OUTPUT"
            echo "verdict=🔴 실서비스가 응답하지 않는다(/api/health $code). 진짜 장애다." >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Issue 자동 생성 (실패 시)
        # ⚠️ 경보는 «예약 실행»에서만. 사람이 수동으로 돌려본 실패까지 «프로덕션 이상»으로
        #    긴급 메일·urgent 이슈를 쏘면 헛경보가 되고, 곧 아무도 안 믿는 경보가 된다.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          PROD_VERDICT: ${{ steps.prodhealth.outputs.verdict }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 🌙 프로덕션 야간 E2E 실패',
              '',
              `- **대상**: https://www.healwith.co.kr`,
              `- **실행 시각 (KST)**: ${new Date(Date.now() + 9*3600000).toLocaleString('ko-KR')}`,
              `- **Actions 로그**: [바로가기](${runUrl})`,
              '',
              `> ${process.env.PROD_VERDICT || '프로덕션 서비스 이상 가능성. 즉시 확인 필요.'}`,
            ].join('\n');

            // 중복 이슈 방지 — 열린 야간 실패 이슈가 있으면 코멘트로 누적 (POSTMORTEMS #112)
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'e2e-failure,production',
              state: 'open',
              per_page: 20,
              sort: 'created',
              direction: 'desc',
            });
            // listForRepo 는 라벨 일치 시 PR 도 반환 — 이슈만 남긴다 (독립 리뷰)
            const openIssues = existing.filter((i) => !i.pull_request);
            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🌙 프로덕션 E2E 실패 — ${new Date().toLocaleDateString('ko-KR')}`,
                body,
                labels: ['e2e-failure', 'production', 'urgent'],
              });
            }

      - name: Slack 알림 (실패 시)
        if: failure() && github.event_name == 'schedule' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 *프로덕션 E2E 실패* — 야간 자동 점검\n대상: https://www.healwith.co.kr\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 보기>",
              "attachments": [{"color": "danger", "text": "프로덕션 서비스 이상 가능성. 즉시 확인 필요합니다."}]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 이메일 알림 (프로덕션 실패 — URGENT)
        if: failure() && github.event_name == 'schedule' && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          MAIL_SUBJECT: ${{ steps.prodhealth.outputs.subject }}
          PROD_VERDICT: ${{ steps.prodhealth.outputs.verdict }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"$MAIL_SUBJECT\",
              \"html\": \"<h2 style='color:red'>🚨 야간 자동 점검 실패</h2><p><strong>$PROD_VERDICT</strong></p><p><strong>유형:</strong> 야간 자동 점검 (cron)</p><p><strong>대상:</strong> https://www.healwith.co.kr</p><p><strong>일시 (KST):</strong> $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M:%S')</p><p>GitHub Issue 로 자동 기록됨.</p><p><a href='\\\"$RUN_URL\\\"'>실행 로그 보기 →</a></p>\"
            }"
