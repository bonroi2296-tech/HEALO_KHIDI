name: Chat Smoke (AI agent guards)

# AI 챗 핵심 가드를 프로덕션에서 매일 자동 점검(PO 수동 클릭 대체):
#   A) 연락처 없이 "접수해줘" → 거짓 "접수완료" 금지·연락처 요청
#   B) "로그인 안 했는데 저장돼?" → 정직한 저장/30일 안내
#   C) 지식질문 → 응답 metadata.rag_chunks_used > 0 (RAG 실사용 가드, POSTMORTEMS #48 재발방지)
# 실패하면 이 워크플로가 빨강 → 알림. 테스트 스레드는 끝나면 service_role 로 자동 삭제(DB 오염 0).

on:
  schedule:
    - cron: "30 18 * * *" # 매일 18:30 UTC (KST 03:30)
  workflow_dispatch: {}

jobs:
  smoke:
    name: AI 챗 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run chat smoke test
        env:
          # 점검 대상(미설정 시 스크립트 기본값 https://healo-khidi.vercel.app)
          BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          # 테스트 스레드 자동 정리용(없으면 정리 건너뜀 — DB에 테스트 스레드 남음)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # shell: bash 명시 = -eo pipefail — tee 뒤에서도 스모크의 실패 코드가 살아남는다
        shell: bash
        run: node scripts/smoke-chat.mjs 2>&1 | tee smoke.txt

      # 실패 알림 — 깃허브 기본 알림에 기대지 않는다(sweep.yml 과 같은 길: Resend → E2E_ALERT_EMAIL).
      # 왜: 2026-08-04~30 이 검사가 26회 연속 빨간불이었는데 알림 스텝이 없어 아무도 몰랐다.
      #     머리말의 「실패하면 빨강 → 알림」은 희망사항이었지 배선이 아니었다.
      - name: 메일로 알리기 (실패했을 때만)
        if: failure() && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(grep -E '^(❌|⚠️|결과:)' smoke.txt | head -15 | sed ':a;N;$!ba;s/\n/<br>/g') # pipefail-ok: 요약 추출용 — 못 뽑아도(빈 본문) 메일 발송 자체는 계속돼야 한다
          # JSON 은 jq 로 짓는다 — sed 이스케이프는 본문의 백슬래시(예: 실패 답변 속 \")를 못 다뤄
          # 페이로드가 깨지고, 그러면 Resend 가 422 를 주는데 curl 은 -f 없이는 그것도 초록이라
          # «알림이 죽었는데 아무도 모름»이 재발한다. -fsS = 4xx/5xx 면 이 스텝이 눈에 보이게 빨강.
          PAYLOAD=$(jq -n --arg to "$E2E_ALERT_EMAIL" --arg body "$BODY" --arg run "$RUN_URL" \
            '{from: "onboarding@resend.dev", to: $to,
              subject: "🤖 HEALO AI 챗 스모크 — 실서비스 가드가 빨간불입니다",
              html: ("<h2>AI 챗 스모크 실패</h2><p>" + $body + "</p><p><a href=\"" + $run + "\">전체 로그 보기 →</a></p>")}')
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
