# HEALO CI: install → vercel config 검증 → build → verify:rag (RAG 회귀 방지)
# vercel.json Hobby 플랜 위반 또는 verify:rag 실패 시 배포 차단
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: vercel.json 검증 (Hobby 플랜 호환성)
        run: node scripts/validate-vercel-config.js
      - run: npm run build
      - run: npm run verify:rag
