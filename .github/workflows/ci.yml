# healwith CI: install → vercel config 검증 → 단위 테스트 → build → verify:rag (RAG 회귀 방지)
# 단위 테스트(vitest)·vercel.json·verify:rag 실패 시 배포 차단 = PR에 ✅/❌ 로 표시
# (비개발자도 초록불=기계 검증 통과 로 판단 가능)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: vercel.json 검증 (Hobby 플랜 호환성)
        run: node scripts/validate-vercel-config.js
      - name: 단위 테스트 (vitest — 로직 회귀 자동 검사)
        run: npm run test:run
      - run: npm run build
      - run: npm run verify:rag
