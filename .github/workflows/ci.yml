# healwith CI: install → vercel config 검증 → 단위 테스트 → build → verify:rag (RAG 회귀 방지)
# 단위 테스트(vitest)·vercel.json·verify:rag 실패 시 배포 차단 = PR에 ✅/❌ 로 표시
# (비개발자도 초록불=기계 검증 통과 로 판단 가능)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: vercel.json 검증 (Hobby 플랜 호환성)
        run: node scripts/validate-vercel-config.js
      - name: 타입 검사 (tsc --noEmit — 타입 퇴행 차단, 실패 시 머지 차단)
        run: npm run typecheck
      - name: 단위 테스트 (vitest — 로직 회귀 자동 검사)
        run: npm run test:run
      # lint: 기존 에러 67건을 0으로 정리(2026-06-19) → blocking 게이트로 승격.
      # 이제 eslint ERROR 가 1건이라도 생기면 머지 차단(경고 1100여건은 비차단 — 점진 정리).
      - name: 코드 린트 (eslint — 에러 발생 시 머지 차단)
        run: npm run lint
      - name: 콘텐츠 일관성 (옛 브랜드·이메일 잔재 + i18n 키 누락 자동 차단)
        run: npm run check:content
      # 완성도 루브릭(Definition of Done) SoR 무결성 — 골격 단계라 비차단(경고).
      # 안정·오탐 검증 후 continue-on-error 제거해 blocking 으로 승격 예정(docs/DEFINITION_OF_DONE.md 로드맵).
      - name: 완성도 루브릭 SoR 정합성 (판단 기준 채점표가 부패·문서 드리프트하지 않게 — 비차단)
        run: npm run check:completeness
        continue-on-error: true
      - name: 마이그레이션 멱등성 (재실행 충돌 위험·DROP IF EXISTS 가드 누락 차단)
        run: npm run check:migrations
      - name: 스키마 참조 (존재하지 않는 테이블 .from() 차단 — 조용한 빈데이터 방지 #35-S2)
        run: npm run check:schema-refs
      - name: 비자 데이터 프레시니스 (기한 지난 비자·K-ETA 규정 자동 차단 — POSTMORTEMS #57)
        run: npm run check:visa-freshness
      - name: PDF 톤 (초청장·견적서·동의서 Premium 톤 복귀 차단 — serif·gold·외부폰트)
        run: npm run check:pdf-tone
      - run: npm run check:i18n
      - name: 법률 문서 6개 언어 정합성 (약관·개인정보방침 구조/번역 누락 차단)
        run: npm run check:legal
      - name: 환자·공개 화면 원시 err.message 노출 차단 (보안 — POSTMORTEMS #52 재발방지)
        run: npm run check:err-exposure
      - name: 암종 콘텐츠 6개 언어 완성 (합병증·FAQ·통계 번역 누락 차단)
        run: npm run check:cancer-i18n
      - name: 세션훅 데이터 소스 (관문 보채기·PO 취향 주입이 조용히 죽는 것 차단)
        run: npm run check:hook-data
      - name: 시크릿 스캔 (하드코딩 비밀키·NEXT_PUBLIC_ 비밀키 노출 차단 — 감리 실측)
        run: npm run audit:secret
      - name: 의존성 취약점 (high/critical 발견 시 머지 차단 — 감리 실측)
        run: npm run audit:deps
      - name: 이미지 용량 게이트 (과대 public 이미지 재유입 차단 — 성능)
        run: npm run audit:images
      - run: npm run build
      - run: npm run verify:rag
