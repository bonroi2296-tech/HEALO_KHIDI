# healwith CI: install → vercel config 검증 → 단위 테스트 → build → verify:rag (RAG 회귀 방지)
# 단위 테스트(vitest)·vercel.json·verify:rag 실패 시 배포 차단 = PR에 ✅/❌ 로 표시
# (비개발자도 초록불=기계 검증 통과 로 판단 가능)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 손으로 돌리기 — 깃허브가 어떤 이유로든 신청서(PR)에 검사를 «안 붙여줄 때» 쓰는 비상구.
  # 실제로 그런 일이 났다(2026-07-28): 같은 신청서인데 첫 커밋에만 검사가 붙고 이후
  # 커밋 3개에는 아예 안 붙었다(다른 브랜치는 같은 시각 정상 동작 — 충돌도 없었음).
  # 검사를 못 돌리면 「초록불 확인 후 머지」 규칙 자체가 멈춘다 → 언제든 깨울 수 있게 열어둔다.
  # Actions 탭 → CI → "Run workflow" 에서 브랜치 골라 실행.
  #   ↳ 주소: https://github.com/bonroi2296-tech/HEALO_KHIDI/actions/workflows/ci.yml
  #
  # 🔁 2026-08-04 두 번째 재발 — 그때 무엇이 먹혔고 무엇이 안 먹혔는지 실측으로 남긴다(#1262).
  #    증상: 한 신청서의 커밋 3개 연속으로 CI·Smoke Tests 가 «생성조차» 안 됨.
  #          같은 시각 다른 작업본 3개는 정상으로 붙고 통과 → 장치 고장이 아니라 «그 신청서만»의 문제.
  #    ❌ 위 workflow_dispatch — 자동화 세션(GitHub App 토큰)은 403 「Resource not accessible by
  #       integration」 으로 못 쏜다. **사람이 브라우저로 눌러야 한다.** 어시는 이 길이 막혀 있다.
  #    ❌ 빈 커밋(`git commit --allow-empty`) 으로 synchronize 다시 일으키기 — 안 붙었다.
  #    ❌ 본판(main) 을 끌어와 합치기 — 안 붙었다(기준 따라잡기라는 값은 따로 있었지만).
  #    ✅ **신청서를 닫았다 다시 열기** — 이걸로 붙었다. 어시 권한으로도 된다.
  #       ⚠️ 닫았다 여는 사이 본판이 앞으로 가면 충돌(dirty)이 날 수 있다 → 열고 나서 기준 다시 맞출 것.
  #    ⚠️ 「검사가 안 붙은 것」과 「통과한 것」은 다르다. 안 붙으면 초록불 판정 자체가 없으니 합치지 마라.
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 기본값(1)이면 «과거 커밋»이 없다. 그러면 실제 사고를 재현하는 시험
          # (반성문 #106·#27·#94 부류)이 조용히 «건너뜀» 처리돼 자동검사에선 한 번도 안 돈다.
          # 2026-08-06 실측: 그 상태로 3개가 skipped 였다 — 핵심 시험이 장식이 돼 있었다.
          # 「초록불인데 실은 안 본 것」 부류라 이력을 받아 실제로 돌게 한다.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: vercel.json 검증 (Hobby 플랜 호환성)
        run: node scripts/validate-vercel-config.js
      # 이 판정이 틀리면 실서비스 배포가 «조용히» 안 나간다 = 가장 비싼 사고. 그래서 차단 게이트.
      - name: 배포 스킵 판정 자체검사 (프리뷰 OFF·3시 배포 창구 규칙이 코드를 안 막는지)
        run: bash scripts/test-vercel-ignore-build.sh
      - name: 타입 검사 (tsc --noEmit — 타입 퇴행 차단, 실패 시 머지 차단)
        run: npm run typecheck
      - name: 단위 테스트 (vitest — 로직 회귀 자동 검사)
        run: npm run test:run
      # lint: 기존 에러 67건을 0으로 정리(2026-06-19) → blocking 게이트로 승격.
      # 이제 eslint ERROR 가 1건이라도 생기면 머지 차단(경고 1100여건은 비차단 — 점진 정리).
      - name: 코드 린트 (eslint — 에러 발생 시 머지 차단)
        run: npm run lint
      - name: 콘텐츠 일관성 (옛 브랜드·이메일 잔재 + i18n 키 누락 자동 차단)
        run: npm run check:content
      # 지침이 다시 한 통으로 불어나는 것을 막는다 — CLAUDE.md 상한·분류 태그 필수·죽은 문서 참조.
      # 왜: 활성 취향을 -86% 로 줄인 날 반나절 만에 +38% 되찼다(2026-07-28). 문서로만 적으면 안 지켜진다.
      - name: 지침 구조 (CLAUDE.md 상한 + 취향 분류 태그 + 죽은 문서 참조 차단)
        run: npm run check:rules
      # 완성도 루브릭(Definition of Done) SoR 무결성 — 골격 단계라 비차단(경고).
      # 안정·오탐 검증 후 continue-on-error 제거해 blocking 으로 승격 예정(docs/DEFINITION_OF_DONE.md 로드맵).
      - name: 완성도 루브릭 SoR 정합성 (판단 기준 채점표가 부패·문서 드리프트하지 않게 — 비차단)
        run: npm run check:completeness
        continue-on-error: true
      - name: 마이그레이션 멱등성 (재실행 충돌 위험·DROP IF EXISTS 가드 누락 차단)
        run: npm run check:migrations
      - name: 스키마 참조 (존재하지 않는 테이블 .from() 차단 — 조용한 빈데이터 방지 #35-S2)
        run: npm run check:schema-refs
      - name: 비자 데이터 프레시니스 (기한 지난 비자·K-ETA 규정 자동 차단 — POSTMORTEMS #57)
        run: npm run check:visa-freshness
      - name: PDF 톤 (초청장·견적서·동의서 Premium 톤 복귀 차단 — serif·gold·외부폰트)
        run: npm run check:pdf-tone
      - run: npm run check:i18n
      - name: 법률 문서 6개 언어 정합성 (약관·개인정보방침 구조/번역 누락 차단)
        run: npm run check:legal
      - name: 법 조문 인용 (환자 노출 문구의 조문 번호가 실제 그 조문인지 — §15 오인용 재발 차단)
        run: npm run check:legal-citations
      - name: 성과지표 정직성 (공식 산출물이 시험 데이터를 실적으로 세는 것 차단 — 3회 재발)
        run: npm run check:metric-honesty
      - name: 환자·공개 화면 원시 err.message 노출 차단 (보안 — POSTMORTEMS #52 재발방지)
        run: npm run check:err-exposure
      - name: 비밀 관문 횟수제한이 인스턴스별 메모리로 돌아가는 것 차단 (보안 — 상한이 인스턴스 수만큼 곱해짐)
        run: npm run check:ratelimit-scope
      - name: 「이메일 같으면 본인 것」 판정이 인증 안 된 주소를 쓰는 것 차단 (보안 — 남의 자료 열람)
        run: npm run check:email-ownership
      - name: 암종 콘텐츠 6개 언어 완성 (합병증·FAQ·통계 번역 누락 차단)
        run: npm run check:cancer-i18n
      - name: 세션훅 데이터 소스 (관문 보채기·PO 취향 주입이 조용히 죽는 것 차단)
        run: npm run check:hook-data
      # 말투 검사기 자체가 썩는 것 차단 — 검사기가 고장나면 「검사한다」는 말만 남는다.
      # (검사 대상인 대화 본문은 CI 가 볼 수 없다. 실제 측정은 턴 종료 훅 self-check.sh 가 한다.)
      - name: 말투 검사기 자체 시험 (쉬운 말+원어 병기 판정이 살아있는지)
        run: npm run check:talk -- --self-test
      # 버튼 연타 측정기도 같은 이유로 지킨다. 특히 「도구 결과(버튼 답)를 PO 발화로 세면
      # 연타가 1회로 뭉개진다」는 함정이 있어서, 그 회귀를 잡는 시험이 시험 목록에 들어 있다.
      - name: 버튼 연타 측정기 자체 시험 (눌러줘도 또 묻는 것을 잡아내는지)
        run: npm run check:ask
      # 인수인계 완결성 — 지금까지 «사람이 /handoff 를 부를 때만» 돌아서, 검사기 자신이 고장나도
      # 아무도 몰랐다(2026-07-30 에만 두 번: 표식을 못 찾아 **옛 블록을 검사하고 초록불**을 냈다).
      # 본판 최상단 블록은 항상 온전해야 하니 자동 검사에서도 잰다.
      - name: 인수인계 완결성 (최상단 블록 7칸·절대날짜 + 엉뚱한 블록 검사 차단)
        run: npm run check:handoff
      # 「만들었나」가 아니라 「뜨나」로 판정한다 — 이 저장소에서 두 번 데인 부류(반성문 #152).
      # 가짜 저장소를 만들어 훅을 실제로 돌리고 경보 문구가 나오는지 본다.
      - name: 세션 시작 경보 실동작 (열린 작업·겹침 감지·서랍 경보가 진짜 뜨는지)
        run: npm run test:alarms
      - name: 시크릿 스캔 (하드코딩 비밀키·NEXT_PUBLIC_ 비밀키 노출 차단 — 감리 실측)
        run: npm run audit:secret
      - name: 의존성 취약점 (high/critical 발견 시 머지 차단 — 감리 실측)
        run: npm run audit:deps
      - name: 이미지 용량 게이트 (과대 public 이미지 재유입 차단 — 성능)
        run: npm run audit:images
      - run: npm run build
      - run: npm run verify:rag
      # 영향 반경 — 「A 를 고쳤는데 파생된 B 가 고장난다」를 «합치기 전»에 눈에 보이게.
      # ⚠️ 일부러 «비차단»이다. 나머지 검사는 전부 «알려진 규칙 목록»(금지 토큰·번역 누락·유령 컬럼)이라
      #    목록에 없는 새 파손은 못 본다. 이건 목록이 아니라 «관계»를 본다 — 무엇이 깨질지는 몰라도
      #    «어디까지 닿는지»는 안다. 그래서 판정이 아니라 지도이고, 차단하면 회피만 부른다.
      #    결과는 실행 화면 요약(Summary)에 표로 남아 나중에 «그때 이 화면이 반경에 있었네»를 되짚을 수 있다.
      - name: 영향 반경 지도 (파생 파손이 닿는 화면·같이 사라진 기능 — 비차단, 기록용)
        if: always()
        run: |
          # 체크아웃이 얕게(depth 1) 받아오면 본판과 비교할 기준점이 없다 → 먼저 본판을 조금 더 끌어온다.
          git fetch --depth=100 origin main 2>/dev/null || true
          BASE=origin/main
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=HEAD~1
          {
            echo "## 🎯 영향 반경 (파생 파손 지도)"
            echo "기준: \`$BASE\`"
            echo '```'
            node scripts/blast-radius.mjs --base "$BASE" 2>&1 | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
