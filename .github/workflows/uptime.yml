# 프로덕션 생사 감시 — /api/health 를 10분마다 두드린다.
#
# 왜(POSTMORTEMS #117): 2026-07-24 DB 가 55분간 죽었는데 **아무 경보도 없었다.**
# 정적·캐시 페이지는 200 이라 겉보기 멀쩡했고(가려진 장애), 로그인·문의접수·백오피스만
# 침묵. `/api/health`(DB 까지 실측하는 정직한 헬스)가 이미 있었는데 아무도 폴링하지
# 않아 12시간 호출이 2건뿐이었다. Vercel runtime_errors 도 503 을 에러로 안 센다.
#
# 설계 원칙(독립 리뷰 반영):
#  ① curl 이 어떻게 실패하든 스텝이 죽으면 안 된다. 기본 셸이 `bash -e` 라
#     `body="$(curl …)"` 는 실패 즉시 스텝을 끝내고, 그러면 뒤의 경보 스텝이 전부
#     스킵된다 — **사이트가 완전히 죽은 순간에 감시기가 침묵**하는 최악의 실패.
#     📝 2026-08-28 정정: 여기 원래 「기본 셸이 `bash -eo pipefail`」이라 적혀 있었다 — 틀렸다.
#     깃허브의 «기본» 셸은 `bash -e {0}` 로 **pipefail 이 꺼져 있다**(실행 기록에 그대로 찍힌다).
#     `-e` 하나만으로도 위 ①의 결론은 그대로 맞지만, 이 틀린 한 줄이 sweep.yml 에서 진짜 사고를 낳았다
#     (파이프 뒤 실패가 13번 내리 삼켜짐). 이제 `npm run check:workflow-pipefail` 이 기계로 막는다.
#  ② 응답 본문(공격자가 통제 가능한 외부 입력)은 다음 스텝으로 넘기지 않는다.
#     넘기는 건 숫자 HTTP 코드뿐 → 명령 주입·JSON 파손·UTF-8 절단이 원천 소멸.
#
# ⚠️ 감지 지연 — 실측(2026-07-24)으로 확인된 한계. 과장 금지:
#   이 저장소의 GitHub schedule 은 **선언 시각보다 늦게** 발화한다. 2026-07 첫 실측은 64~98분이었는데,
#   2026-08-28 재실측에서 **최대 467분(7시간 47분)**까지 벌어졌다 — 그날 야간 E2E 는 444분,
#   chat-smoke 는 467분 늦게 떴다. 「예약 시각에 기록이 없다 = 안 돌았다」로 판정하지 마라.
#   (chat-smoke `30 18`→19:53~20:08 / e2e `0 19`→20:04~20:16 / audit `0 16`→17:12, 10회 전부)
#   신설 직후 1시간 동안 `*/10` 이 **한 번도 안 떴다**(예약 드랍). 즉 "10분마다 감지"가 아니라
#   **"언젠가 뜨는 best-effort"** 다. 즉시 확인이 필요하면 Actions 탭에서 수동 실행(workflow_dispatch).
#
# ✅ 2026-09-04: 위에서 「PO 결정 항목」이라 적어 둔 외부 모니터를 **붙였다 — 그 결정은 끝났다.**
#   UptimeRobot 무료(PO 구글 계정, bonroi2296@gmail.com 으로 경보):
#     · 같은 주소(https://healwith.co.kr/api/health)를 **5분마다** 본다 — 이 워크플로는 실측 «하루 7회»였다
#       (10분 예약인데 간격 109~299분, 평균 3시간 33분). 42배 촘촘해진 셈이다.
#     · 「2xx·3xx 만 정상」이라 DB 가 죽어 503 이 나오면 그대로 장애로 잡힌다.
#     · 무료라 요청 방식은 HEAD 고정이다(GET 선택은 유료). Next.js 가 GET 핸들러로 HEAD 를 처리하므로
#       DB 프로브는 그대로 돌지만, **DB 가 실제로 죽었을 때 503 이 오는지는 아직 실장애로 확인 못 했다.**
#
# ponytail: 그런데도 이 워크플로를 **지우지 마라.** 값싼 두 번째 그물이고, 무엇보다 «보는 자리»가 다르다 —
#   UptimeRobot 은 밖에서 보지만 우리 경보 메일·이슈 생성은 여기 있다. 깃허브가 죽으면 이게 침묵하고,
#   UptimeRobot 이 죽으면 저쪽이 침묵한다. 둘 다 두는 값이 0원이므로 둘 다 둔다.
# 그 밖의 한계: GitHub·Vercel 동반 장애 시 침묵 / schedule 은 main 머지 후부터 / 저장소 60일 무활동 시 중단.
name: Uptime (prod)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /api/health 실측 (2회 연속 실패만 장애로 — 일시 흔들림 무시)
        id: probe
        env:
          URL: ${{ secrets.E2E_PROD_BASE_URL || 'https://www.healwith.co.kr' }}
        run: |
          # `|| true` 필수 — 없으면 DNS 실패(6)·연결거부(7)·타임아웃(28)에 스텝이 즉사하고
          # 경보 스텝이 통째로 스킵된다(실측 재현). 본문 끝에 HTTP 코드를 한 줄로 덧붙인다.
          probe() { curl -sSL -m 20 -w '\n%{http_code}' "$URL/api/health" 2>/dev/null || true; }
          out="$(probe)"
          if ! printf '%s' "$out" | grep -q '"db":"up"'; then
            sleep 30
            out="$(probe)"
          fi

          # 사람이 볼 원문은 로그에만. 제어문자 제거 + 워크플로 커맨드(::) 무력화 + 300바이트 컷.
          echo "raw: $(printf '%s' "$out" | tr -d '\000-\037' | sed 's/::/;;/g' | cut -b1-300)"

          # 다음 스텝으로 넘기는 값은 **숫자뿐** — 외부 입력을 문자 그대로 흘리지 않는다.
          code="$(printf '%s' "$out" | tail -n1 | tr -cd '0-9' | cut -b1-3)"
          echo "code=${code:-000}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$out" | grep -q '"db":"up"'; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 이메일 경보 (실패 시)
        if: steps.probe.outputs.down == 'true' && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          CODE: ${{ steps.probe.outputs.code }}
        run: |
          # CODE 는 숫자 3자리로 정규화된 값 → JSON 파손·주입 여지 없음(추가 도구 불필요).
          payload="{\"from\":\"onboarding@resend.dev\",\"to\":\"$E2E_ALERT_EMAIL\",\"subject\":\"[HEALO] 데이터베이스 응답 없음 — 로그인·문의접수 중단 가능\",\"html\":\"<h2 style='color:red'>DB 가 응답하지 않습니다</h2><p>홈 같은 페이지는 멀쩡해 보여도 <b>로그인·문의 접수·백오피스</b>가 멈춰 있을 수 있습니다.</p><p><b>/api/health 응답 코드:</b> $CODE (000 = 아예 무응답)</p><p><b>확인 순서:</b> Supabase 대시보드 → Reports(CPU·메모리·디스크) → 안 풀리면 Settings → General → Restart project</p>\"}"
          # 응답 코드를 반드시 찍는다 — Resend 테스트모드 403 처럼 "조용히 안 감"이
          # 오늘 장애의 교훈(가려진 실패). 실패해도 이슈 경보는 남으므로 잡은 안 죽인다.
          rc="$(curl -sS -o /tmp/resend.out -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "$payload" || true)"
          echo "Resend HTTP ${rc:-000}: $(tr -d '\000-\037' < /tmp/resend.out | cut -b1-300)"
          case "$rc" in
            2*) ;;
            *) echo "::warning::경보 이메일 발송 실패(HTTP ${rc:-000}) — KNOWN_ISSUES 의 E2E_ALERT_EMAIL 항목 확인 필요" ;;
          esac

      - name: 이슈 생성·누적 (실패 시)
        if: steps.probe.outputs.down == 'true'
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.probe.outputs.code }}
        with:
          script: |
            const code = String(process.env.CODE || '000').replace(/\D/g, '') || '000';
            const body = [
              '## 🚨 프로덕션 DB 응답 없음',
              '',
              `- **감지 시각(UTC)**: ${new Date().toISOString()}`,
              `- **/api/health HTTP 코드**: ${code}${code === '000' ? ' (아예 무응답 — 연결 실패·타임아웃)' : ''}`,
              '',
              '홈 등 정적·캐시 페이지는 200 이라 겉보기 정상일 수 있음(가려진 장애).',
              '실제로 멈추는 것: 로그인 · 문의 접수 · 백오피스 · 화상상담 생성.',
              '',
              '**확인**: Supabase 대시보드 → Reports → 필요 시 Restart project (POSTMORTEMS #117)',
            ].join('\n');
            // 열린 장애 이슈가 있으면 코멘트로 누적 — 10분마다 새 이슈가 쌓이는 스팸 방지(#112).
            // per_page 를 넉넉히: listForRepo 는 라벨 일치 시 PR 도 반환하므로 1건만 받으면
            // 그 자리에 PR 이 걸렸을 때 dedupe 가 통째로 빗나간다(독립 리뷰).
            const { data: found } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'uptime,automated', state: 'open', per_page: 20, sort: 'created', direction: 'desc',
            });
            const issues = found.filter((i) => !i.pull_request);
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🚨 프로덕션 DB 다운 — ${new Date().toLocaleDateString('ko-KR')}`,
                body, labels: ['uptime', 'automated', 'urgent'],
              });
            }

      - name: 회복 시 이슈 닫기
        if: steps.probe.outputs.down == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: found } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'uptime,automated', state: 'open', per_page: 20,
            });
            for (const i of found.filter((x) => !x.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `✅ 회복 확인 (${new Date().toISOString()}) — /api/health 가 \`db:"up"\` 응답.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed',
              });
            }

      - name: 장애면 잡 실패로 표시
        if: steps.probe.outputs.down == 'true'
        env:
          CODE: ${{ steps.probe.outputs.code }}
        run: |
          # 표현식 보간을 run 본문에 직접 박으면 응답 유래 문자열이 셸로 실행될 수 있어 env 경유.
          # (주의: 주석이어도 GitHub 은 표현식 문법을 파싱한다 — 빈 보간을 쓰면 워크플로가 통째로 깨짐)
          echo "::error::프로덕션 DB 무응답 (/api/health HTTP $CODE)"
          exit 1
