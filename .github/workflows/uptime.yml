# 프로덕션 생사 감시 — /api/health 를 10분마다 두드린다.
#
# 왜(POSTMORTEMS #117): 2026-07-24 DB 가 55분간 죽었는데 **아무 경보도 없었다.**
# 정적·캐시 페이지는 200 이라 겉보기 멀쩡했고(가려진 장애), 로그인·문의접수·백오피스만
# 침묵. `/api/health`(DB 까지 실측하는 정직한 헬스)가 이미 있었는데 아무도 폴링하지
# 않아 12시간 호출이 2건뿐이었다. Vercel runtime_errors 도 503 을 에러로 안 센다.
#
# ponytail: 외부 유료 모니터(UptimeRobot 등) 붙이기 전의 무료 최소판. GitHub cron 은
# 몇 분 밀릴 수 있지만 "55분 무경보"를 "10~20분 내 통보"로 바꾸는 데는 충분하다.
# 한계(정직): GitHub Actions·Vercel 이 동시에 죽으면 이 감시기도 침묵 → 진짜 외부
# 모니터는 여전히 PO 결정 항목.
name: Uptime (prod)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /api/health 실측 (2회 연속 실패만 장애로 — 일시 흔들림 무시)
        id: probe
        env:
          URL: ${{ secrets.E2E_PROD_BASE_URL || 'https://www.healwith.co.kr' }}
        run: |
          probe() { curl -sSL -m 20 "$URL/api/health" 2>/dev/null; }
          body="$(probe)"
          if ! echo "$body" | grep -q '"db":"up"'; then
            sleep 30
            body="$(probe)"
          fi
          echo "body=$body"
          if echo "$body" | grep -q '"db":"up"'; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
            echo "detail=${body:-무응답(연결 실패 또는 타임아웃)}" >> "$GITHUB_OUTPUT"
          fi

      - name: 이메일 경보 (실패 시)
        if: steps.probe.outputs.down == 'true' && env.RESEND_API_KEY != '' && env.E2E_ALERT_EMAIL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL: ${{ secrets.E2E_ALERT_EMAIL }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"onboarding@resend.dev\",
              \"to\": \"$E2E_ALERT_EMAIL\",
              \"subject\": \"🚨 [HEALO] 데이터베이스 응답 없음 — 로그인·문의접수 중단 가능\",
              \"html\": \"<h2 style='color:red'>DB 가 응답하지 않습니다</h2><p>홈 같은 페이지는 멀쩡해 보여도 <b>로그인·문의 접수·백오피스</b>가 멈춰 있을 수 있습니다.</p><p><b>응답:</b> $DETAIL</p><p><b>확인 순서:</b> Supabase 대시보드 → Reports(CPU·메모리·디스크) → 안 풀리면 Settings → General → Restart project</p>\"
            }"

      - name: 이슈 생성·누적 (실패 시)
        if: steps.probe.outputs.down == 'true'
        uses: actions/github-script@v7
        env:
          DETAIL: ${{ steps.probe.outputs.detail }}
        with:
          script: |
            const body = [
              '## 🚨 프로덕션 DB 응답 없음',
              '',
              `- **감지 시각(UTC)**: ${new Date().toISOString()}`,
              `- **/api/health 응답**: \`${process.env.DETAIL}\``,
              '',
              '홈 등 정적·캐시 페이지는 200 이라 겉보기 정상일 수 있음(가려진 장애).',
              '실제로 멈추는 것: 로그인 · 문의 접수 · 백오피스 · 화상상담 생성.',
              '',
              '**확인**: Supabase 대시보드 → Reports → 필요 시 Restart project (POSTMORTEMS #117)',
            ].join('\n');
            // 열린 장애 이슈가 있으면 코멘트로 누적 — 10분마다 새 이슈가 쌓이는 스팸 방지(#112)
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'uptime,automated', state: 'open', per_page: 1, sort: 'created', direction: 'desc',
            });
            const issues = open.filter((i) => !i.pull_request);
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `🚨 프로덕션 DB 다운 — ${new Date().toLocaleDateString('ko-KR')}`,
                body, labels: ['uptime', 'automated', 'urgent'],
              });
            }

      - name: 회복 시 이슈 닫기
        if: steps.probe.outputs.down == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'uptime,automated', state: 'open', per_page: 10,
            });
            for (const i of open.filter((x) => !x.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number,
                body: `✅ 회복 확인 (${new Date().toISOString()}) — /api/health 가 \`db:"up"\` 응답.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed',
              });
            }

      - name: 장애면 잡 실패로 표시
        if: steps.probe.outputs.down == 'true'
        run: |
          echo "::error::프로덕션 DB 무응답 — ${{ steps.probe.outputs.detail }}"
          exit 1
