# 실서비스 감리 실측 — axe-core(접근성) + Lighthouse(성능·SEO) 를 프로덕션 대상으로 측정.
# 깨끗한 망의 CI 러너에서 돌리므로(로컬 샌드박스 프록시 제약 없음) Lighthouse 가 실제로 실행됨.
# 결과 JSON 은 아티팩트로 업로드(감리 증거). 위반이 있어도 잡(job)은 실패시키지 않음(리포트 목적).
name: Audit (live)
on:
  schedule:
    - cron: "0 16 * * 1" # 매주 월요일 16:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: "측정 대상 URL"
        default: "https://healo-khidi.vercel.app"
        required: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: chromium 설치(playwright)
        run: npx playwright install --with-deps chromium
      - name: 접근성(axe-core WCAG 2.1 AA) 실측
        env:
          AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://healo-khidi.vercel.app' }}
        run: npm run audit:a11y || true
      - name: 성능·SEO(Lighthouse) 실측
        env:
          AUDIT_BASE_URL: ${{ github.event.inputs.base_url || 'https://healo-khidi.vercel.app' }}
        run: npm run audit:lighthouse || true
      - name: 감리 리포트 업로드(증거)
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: docs/audit/*.json
          if-no-files-found: warn
