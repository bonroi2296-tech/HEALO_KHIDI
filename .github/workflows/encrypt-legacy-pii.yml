# 평문으로 남은 환자 개인정보 잠그기 — «손으로만» 돌아가는 일회성 창구.
#
# 왜 여기서 도나: 암호 열쇠(ENCRYPTION_KEY_V1)는 저장소 비밀값과 실서비스에만 있다.
#   작업 상자에는 없어서 어시가 자기 손으로 못 돌린다 → 열쇠가 있는 이 창구에서 돈다.
#
# 기본은 «맛보기»(아무것도 안 바꾸고 몇 칸이 평문인지만 세어 보여준다).
# 실제로 잠그려면 실행할 때 apply 를 true 로 바꾼다.
#
# 실행 주소: https://github.com/bonroi2296-tech/HEALO_KHIDI/actions/workflows/encrypt-legacy-pii.yml
name: 평문 개인정보 잠그기 (수동)

on:
  # ① 사람이 손으로 (Actions 화면의 "Run workflow" 단추)
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 잠글까? (false = 맛보기, 아무것도 안 바꿈)"
        type: boolean
        default: false
  # ② 어시가 스스로 — 전용 작업본에 올리면 돈다.
  #    왜 이 길이 필요한가: 자동화 세션은 위 "Run workflow" 를 못 누른다
  #    (403 Resource not accessible by integration — 이 저장소에서 두 번 확인).
  #    그러면 「어시가 할 수 있는 일을 PO 에게 떠넘기는」 꼴이 된다.
  #    기본은 맛보기이고, 실제로 잠그려면 커밋 제목에 [apply] 를 달아야 한다.
  push:
    branches: [ops/encrypt-legacy-pii]

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: 평문 칸 세기 / 잠그기
        env:
          # ⚠️ 이 저장소의 비밀값은 NEXT_PUBLIC_SUPABASE_URL 이 «비어 있다»(2026-08-14 실측 —
          #    첫 실행이 "URL 없다"로 죽었다). 실제 값은 SUPABASE_URL 에 있다. 둘 다 넘겨 폴백.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY_V1: ${{ secrets.ENCRYPTION_KEY_V1 }}
        run: |
          # 실제 적용 조건은 둘 중 하나뿐 — 손으로 apply=true, 또는 커밋 제목에 [apply].
          # 그 외에는 무조건 맛보기(아무것도 안 바꿈).
          APPLY="no"
          if [ "${{ inputs.apply }}" = "true" ]; then APPLY="yes"; fi
          if printf '%s' "${{ github.event.head_commit.message }}" | head -1 | grep -q '\[apply\]'; then APPLY="yes"; fi
          echo "모드: $([ "$APPLY" = "yes" ] && echo '실제적용' || echo '맛보기')"
          if [ "$APPLY" = "yes" ]; then
            node scripts/encrypt-legacy-plaintext-pii.mjs --live
          else
            node scripts/encrypt-legacy-plaintext-pii.mjs
          fi
