# 배포 창구 — 하루 한 번, 오후 3시(KST)에 그날 머지된 것을 «한 번에» 실서비스로 내보낸다.
#
# 왜: 머지 1건 = 프로덕션 풀빌드 1건(≈$0.044)이었다. 7/28 하루에만 19건이 돌았고
#     Pro 첫 청구의 94%가 빌드 CPU 였다. 그런데 묶어야 할 건 «머지»가 아니라 «배포»다 —
#     PR 을 24시간 붙잡아 두면 작업이 서랍에 갇힌다(PO 정정 2026-07-28).
#     → 머지는 언제든 자유. main 푸시로는 프로덕션이 안 지어지고(scripts/vercel-ignore-build.sh),
#       이 워크플로가 얹는 «[deploy]» 빈 커밋 하나만 지어진다. 그 한 건이 그날치 전부를 포함한다.
#
# 급한 것(장애·보안·PO 가 지금 보자고 한 것)은 기다리지 마라:
#     git commit --allow-empty -m "chore: 긴급 배포 [deploy]" && git push
#   또는 Actions 탭에서 이 워크플로 "Run workflow".
#
# ⚠️ production 브랜치는 이 창구 말고 아무도 건드리지 마라 — 그게 곧 실서비스다.
#
# 📌 2026-07-31: 이 워크플로는 이제 «예비»다. 정시 창구는 Vercel 예약이 연다
#    (app/api/cron/daily-deploy/route.ts). 깃허브가 예약을 제때 안 깨우기 때문 — 실측:
#      · 이 창구(15:00 예약)가 3일 연속 2시간 36~48분 늦게 시작 → 실제 배포 17:40쯤
#        (07-28 17:43 · 07-29 17:48 · 07-30 17:36)
#      · 같은 저장소 10분 감시기도 24시간에 144회가 아니라 14회(간격 64~191분)
#      · 만든 시각 = 시작 시각이라 «일꾼 대기»가 아니라 «깨우는 단계»가 늦다 → 설정으로 못 고친다
#
# 🛑 2026-07-31(같은 날, 실측으로 정정): 위 「스스로 건너뛴다」가 **틀렸다.**
#    이 워크플로의 건너뛰기 판정은 `production` 가지를 본다. 그런데 새 경로(Vercel 예약)는
#    열쇠가 없어 **production 가지를 갱신하지 않고** main 커밋으로 배포를 직접 만든다.
#    → 새 경로가 정시에 배포해도 여기서는 production(옛 커밋) ≠ main 이라 「새 머지 있음」으로
#      보고 **같은 코드를 하루 한 번 더 짓는다.** 실측 2026-07-31: 15:01 에 39c123e6 이 이미
#      실서비스로 나갔는데 production 가지는 108bd6cf 에 멈춰 있었다.
#    프로덕션 빌드 1건 ≈ 60원. 매일이면 월 1,800원이 화면 변화 0인 채로 나간다.
#    Pro 크레딧이 이미 소진된 상태라(2026-07-31 PO) 그대로 추가 요금이다.
#
#    → 1차 조치(2026-07-31 PO 결정 「한 줄 지워서 막기」): 예약 출근을 뗐다.
#
# ✅ 2026-08-03 후속(위 사건은 07-31): **판정을 고쳐서 예약을 되살렸다.**
#    ※ 07-31~08-02 사이엔 새 머지가 없어 창구가 정상적으로 건너뛰었다 — 빠진 배포는 없다
#      (08-01 15:01 에 6624732f 가 나간 것이 마지막, 실측 확인).
#    이제 production 가지가 아니라 **지금 실서비스로 돌고 있는 커밋**과 비교한다
#    (`https://healwith.co.kr/api/health` 의 `commit`). 새 경로가 이미 내보냈으면 여기서
#    건너뛰므로 중복이 없고, 새 경로가 실패한 날엔 늦게라도 이 예비가 그날치를 내보낸다.
#    열쇠를 새로 만들지 않으려고 판정 신호를 공개 헬스체크에 실었다(공개 저장소라 커밋
#    번호는 어차피 누구나 본다). 헬스체크가 안 열리면 «모르면 짓는다»로 배포를 진행한다.

name: Daily Deploy (배포 창구)

on:
  schedule:
    # KST 15:00 = UTC 06:00. 깃허브가 늦게 깨워도(실측 2~3시간) 이건 «예비»라 상관없다 —
    # 정시 창구는 Vercel 예약(app/api/cron/daily-deploy/route.ts)이 연다.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # ⚠️ 전체 이력 필수. fetch-depth:1(얕게 받기)이면 git 이 «production 이 main 의
          #    앞선 이력인지» 증명하지 못해 푸시가 non-fast-forward 로 거부된다(2026-07-28 실측).
          fetch-depth: 0

      # 「오늘 하루만 쉰다」 — 정시 창구(Vercel 예약)와 «같은 목록»을 본다(단일 SoR).
      # 여기만 빼먹으면 정시 창구는 쉬는데 예비가 그날치를 내보내 지시가 무력화된다.
      #
      # ⚠️ 휴무는 «저절로 나가는 것»만 막는다. 사람이 직접 누른 실행(workflow_dispatch)은 통과다.
      #    2026-08-04 실측으로 발견: 휴무를 넣은 이유 자체가 "PO 가 오후 1시에 직접 내보내기로 함"
      #    이었는데, 그 손으로 누른 실행까지 막혀서 «눌러도 아무 일도 안 일어나는» 상태였다.
      #    그날 오전 배포도 손으로 누른 것이었으니(11:25) 이 경로가 실제로 쓰인다.
      #    휴무 = 「자동으로 나가지 마라」이지 「PO 도 못 내보낸다」가 아니다.
      - name: 오늘 창구 휴무인지 확인
        id: holiday
        run: |
          set -uo pipefail
          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "손으로 누른 실행 — 휴무여도 내보낸다"
          elif grep -q "\"$today\"" src/lib/deploy/windowHoliday.ts; then
            echo "오늘($today)은 창구 휴무 — 예비도 쉰다"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "오늘($today)은 정상 가동"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: 이미 나갔는지 확인 (실서비스가 도는 커밋과 대조)
        if: steps.holiday.outputs.skip != '1'
        id: check
        run: |
          set -uo pipefail
          # ⚠️ 예전엔 production 가지를 봤다. 새 경로(Vercel 예약)는 열쇠가 없어 그 가지를
          #    갱신하지 않고 main 커밋으로 배포를 직접 만든다 → 가지를 보면 «아직 안 나갔다»로
          #    잘못 읽어 같은 코드를 매일 한 번 더 지었다(2026-07-31 실측).
          #    그래서 «지금 실서비스가 돌고 있는 커밋»을 직접 물어본다.
          live="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null \
                  | sed -n 's/.*"commit":"\([0-9a-f]\{7,40\}\)".*/\1/p' || true)"
          head="$(git rev-parse HEAD)"
          if [ -n "$live" ] && [ "$live" = "$head" ]; then
            echo "이미 나갔음 (실서비스 커밋 = main) — 배포 생략"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            # 헬스체크가 안 열리거나 커밋을 못 읽으면 «모르면 짓는다» — 배포가 통째로
            # 빠지는 쪽이 중복 1건보다 훨씬 나쁘다.
            echo "배포 진행 (실서비스='${live:-읽지 못함}' / main=$head)"
          fi
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://healwith.co.kr/api/health' }}

      - name: 배포 창구 열기 (main → production 브랜치)
        if: steps.holiday.outputs.skip != '1' && steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          # main 은 보호 브랜치라 로봇이 못 민다(GH006 — 깃허브가 GITHUB_TOKEN 이 만든 커밋에
          # 검사를 안 돌려줘서 「검사 통과」 조건을 영원히 못 채운다). 자물쇠를 푸는 대신
          # 배포 전용 옆문으로 민다. Vercel 의 Production Branch = production.
          #
          # 실패하면 그날 배포가 통째로 안 나간다 → 워크플로를 빨간불로 끝내서 눈에 띄게 한다.
          git push origin HEAD:production
          echo "✅ main → production 푸시 완료 — Vercel 프로덕션 빌드 1건이 돈다."

      # ── 푸시가 성공해도 «배포가 안 만들어질» 수 있다 (2026-08-31 실측) ─────────
      # 그날: 01:36:48 에 main 머지로 프리뷰 배포가 하나 만들어졌고(ignore 스크립트가 취소),
      #       29초 뒤 01:37:17 에 이 창구가 같은 커밋을 production 으로 밀었다.
      #       푸시는 성공했는데(185aa4b5..7dad74b9) Vercel 이 **배포를 아예 안 만들었다** —
      #       같은 커밋의 배포가 방금 있었기 때문으로 보인다. 26분 뒤에도 실서비스는 옛 커밋.
      #       그런데 이 워크플로는 «푸시 성공 = 배포됨»으로 보고 초록불로 끝났다.
      #       → 「검사가 통과라고 말하는데 실은 안 본 것」. 푸시가 아니라 «실서비스»를 재야 한다.
      #
      # ⚠️ 여기서 빨간불이 나면 배포가 안 나간 것이다. 고치는 법: main 에 새 커밋이 하나라도
      #    얹히면 (PR 머지든 [deploy] 빈 커밋이든) 이 워크플로를 다시 돌려라. 같은 커밋을
      #    다시 미는 것은 소용없다 — git 이 "Everything up-to-date" 로 끝나 웹훅이 안 간다.
      - name: 진짜 나갔는지 확인 (실서비스 커밋 대조)
        if: steps.holiday.outputs.skip != '1' && steps.check.outputs.skip != '1'
        run: |
          set -uo pipefail
          head="$(git rev-parse HEAD)"
          for i in $(seq 1 30); do
            live="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null \
                    | sed -n 's/.*"commit":"\([0-9a-f]\{7,40\}\)".*/\1/p' || true)"
            if [ "$live" = "$head" ]; then
              echo "✅ 실서비스 반영 확인 ($head) — ${i}번째 확인, 약 $((i / 2))분"
              exit 0
            fi
            echo "  ($i/30) 실서비스='${live:-읽지 못함}' / 기다리는 커밋=$head"
            sleep 30
          done
          echo "::error::푸시는 됐는데 15분이 지나도 실서비스가 안 바뀌었다 — 배포가 안 만들어졌다."
          echo "main 에 새 커밋을 얹은 뒤 이 워크플로를 다시 돌려라(같은 커밋 재푸시는 무효)."
          exit 1
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://healwith.co.kr/api/health' }}
