# 배포 창구 — 하루 한 번, 오후 3시(KST)에 그날 머지된 것을 «한 번에» 실서비스로 내보낸다.
#
# 왜: 머지 1건 = 프로덕션 풀빌드 1건(≈$0.044)이었다. 7/28 하루에만 19건이 돌았고
#     Pro 첫 청구의 94%가 빌드 CPU 였다. 그런데 묶어야 할 건 «머지»가 아니라 «배포»다 —
#     PR 을 24시간 붙잡아 두면 작업이 서랍에 갇힌다(PO 정정 2026-07-28).
#     → 머지는 언제든 자유. main 푸시로는 프로덕션이 안 지어지고(scripts/vercel-ignore-build.sh),
#       이 워크플로가 얹는 «[deploy]» 빈 커밋 하나만 지어진다. 그 한 건이 그날치 전부를 포함한다.
#
# 급한 것(장애·보안·PO 가 지금 보자고 한 것)은 기다리지 마라:
#     git commit --allow-empty -m "chore: 긴급 배포 [deploy]" && git push
#   또는 Actions 탭에서 이 워크플로 "Run workflow".
#
# ⚠️ production 브랜치는 이 창구 말고 아무도 건드리지 마라 — 그게 곧 실서비스다.

name: Daily Deploy (배포 창구)

on:
  schedule:
    # KST 15:00 = UTC 06:00
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # ⚠️ 0(전체 이력) 이어야 한다. 1(얕은 복제)로 두면 «다른 브랜치로 미는 것»이 통째로 깨진다:
          #    깃이 production 의 조상 관계를 알 수 없어 정상 fast-forward 도 non-fast-forward 로 거부한다.
          #    2026-07-28 실제 증상 — production 을 «처음 만드는» 첫 실행만 성공하고
          #    그 뒤 모든 실행이 실패(그날 배포가 통째로 안 나갔다). 되돌리지 마라.
          fetch-depth: 0

      - name: 오늘 머지된 게 있는지 확인
        id: check
        run: |
          set -uo pipefail
          # production 이 이미 main 과 같으면 그날 머지된 게 없다는 뜻 → 빌드 낭비 방지.
          # (production 브랜치가 아직 없으면 fetch 가 실패한다 → 그냥 배포 진행 = 「모르면 짓는다」.)
          # --depth=1 을 쓰지 마라(위 fetch-depth 주석과 같은 이유 — 조상 관계를 잃는다).
          git fetch origin production >/dev/null 2>&1 || true
          prod="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
          if [ -n "$prod" ] && [ "$prod" = "$(git rev-parse HEAD)" ]; then
            echo "새 머지 없음 (production 이 이미 main 과 동일) — 배포 생략"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 창구 열기 (main → production 브랜치)
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          # main 은 보호 브랜치라 로봇이 못 민다(GH006 — 깃허브가 GITHUB_TOKEN 이 만든 커밋에
          # 검사를 안 돌려줘서 「검사 통과」 조건을 영원히 못 채운다). 자물쇠를 푸는 대신
          # 배포 전용 옆문으로 민다. Vercel 의 Production Branch = production.
          #
          # 실패하면 그날 배포가 통째로 안 나간다 → 워크플로를 빨간불로 끝내서 눈에 띄게 한다.
          git push origin HEAD:production
          echo "✅ main → production 푸시 완료 — Vercel 프로덕션 빌드 1건이 돈다."
